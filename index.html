    </div>
  </div>`;
}
function _acha(tid,id){return S.times[tid].elenco.find(p=>p.id===id);}
function _recalc(p){
  // reconstrói atributos a partir de ovr-alvo, posição e arquétipo (mesma lógica dos reais)
  const rnd=rngDe(hashStr(p.nome+p.pos));
  const chaves=['arr2','arr3','ll','fin','drible','passe','defP','defI','reb','atl','res','qi'];
  chaves.forEach(k=>{p.at[k]=clamp(Math.round(p._ovrAlvo+(PERFIL_POS[p.pos][k]||0)+((PERFIL_ARQ[p.arq]&&PERFIL_ARQ[p.arq][k])||0)+(rnd()-.5)*7),20,99);});
  if(p.idade>=33){p.at.atl-=(p.idade-32)*2.4;p.at.res-=(p.idade-32)*1.8;p.at.qi+=Math.min(8,(p.idade-30)*1.4);}
  chaves.forEach(k=>p.at[k]=clamp(Math.round(p.at[k]),20,99));
  for(let i=0;i<14;i++){const d=p._ovrAlvo-calcOvr(p);if(d===0)break;
    chaves.forEach(k=>p.at[k]=clamp(p.at[k]+(d>0?Math.max(1,Math.round(d*.6)):Math.min(-1,Math.round(d*.6))),20,99));}
  p.ovr=calcOvr(p);p.pot=clamp(Math.max(p.pot,p.ovr),p.ovr,99);p.salario=valorSalarial(p);
}
function edOvr(tid,id,v){const p=_acha(tid,id);p._ovrAlvo=clamp(+v,30,99);_recalc(p);render();}
function edCampo(tid,id,campo,v){const p=_acha(tid,id);p[campo]=+v;if(campo==='idade'){p._ovrAlvo=p._ovrAlvo||p.ovr;_recalc(p);}render();}
function edNome(tid,id,v){const p=_acha(tid,id);p.nome=v.trim()||p.nome;render();}
function edPos(tid,id,v){const p=_acha(tid,id);p.pos=v;p._ovrAlvo=p._ovrAlvo||p.ovr;_recalc(p);render();}
function edArq(tid,id,v){const p=_acha(tid,id);p.arq=v;p._ovrAlvo=p._ovrAlvo||p.ovr;_recalc(p);render();}
function edRemover(tid,id){const t=S.times[tid];if(t.elenco.length<=6){alert('Elenco mínimo de 6.');return;}
  t.elenco=t.elenco.filter(p=>p.id!==id);t.minutos=autoMinutos(t);render();}
function edMover(tid,id,dest){if(dest===''||dest==null)return;const t=S.times[tid];const p=_acha(tid,id);
  t.elenco=t.elenco.filter(x=>x.id!==id);
  if(dest==='free'){p.time=null;(S.livres=S.livres||[]).push(p);}
  else{const d=+dest;if(S.times[d].elenco.length>=15){alert('Time de destino cheio (15).');t.elenco.push(p);}
    else{p.time=d;S.times[d].elenco.push(p);S.times[d].elenco.sort((a,b)=>b.ovr-a.ovr);S.times[d].minutos=autoMinutos(S.times[d]);}}
  t.minutos=autoMinutos(t);render();}
function edMoverLivre(id,dest){if(dest===''||dest==null)return;const d=+dest;const p=(S.livres||[]).find(x=>x.id===id);if(!p)return;
  if(S.times[d].elenco.length>=15){alert('Time cheio.');return;}
  S.livres=S.livres.filter(x=>x!==p);p.time=d;S.times[d].elenco.push(p);
  S.times[d].elenco.sort((a,b)=>b.ovr-a.ovr);S.times[d].minutos=autoMinutos(S.times[d]);render();}
function edAdd(tid){const t=S.times[tid];if(t.elenco.length>=15){alert('Elenco cheio.');return;}
  const p=novoJogador('SF',R(-8,4),20,28);p.nome='Novo Jogador';p.time=tid;p._ovrAlvo=p.ovr;
  t.elenco.push(p);t.elenco.sort((a,b)=>b.ovr-a.ovr);render();}
function edEncaixaTeto(tid){const t=S.times[tid];let f=folha(t);
  if(f<=TETO){alert('Já está dentro do teto ('+$(f)+').');return;}
  const k=TETO*0.98/f;t.elenco.forEach(p=>p.salario=Math.max(1200000,Math.round(p.salario*k/1e5)*1e5));
  render();}
/* ============================================================
   OLHEIRO — contrato anual + sugestões grátis contínuas
   ============================================================ */
const OBJETIVOS_SCOUT = {
  auto:     {nome:'Melhorar o time', desc:'O olheiro decide o que seu elenco mais precisa'},
  custo:    {nome:'Custo-benefício', desc:'Bons jogadores por salário baixo'},
  potencial:{nome:'Jovens promessas', desc:'Talentos jovens com alto potencial'},
  estrela:  {nome:'Estrela imediata', desc:'Um craque para elevar o teto já'},
  lacuna:   {nome:'Tapar buraco',    desc:'Reforço na sua posição mais fraca'},
  picks:    {nome:'Caçar picks',     desc:'Trocas em que você recebe escolhas de draft'},
};
const OBJ_KEYS=Object.keys(OBJETIVOS_SCOUT);
// contrato anual do olheiro: nível define qualidade e quantidade
const SCOUT_NIVEIS=[
  null,
  {nome:'Olheiro regional', custo:4000000,  n:3, alcance:14},
  {nome:'Olheiro nacional', custo:9000000,  n:4, alcance:10},
  {nome:'Olheiro de elite', custo:18000000, n:5, alcance:7},
];

function necessidades(t){
  const porPos={PG:[],SG:[],SF:[],PF:[],C:[]};
  t.elenco.forEach(p=>porPos[p.pos].push(p.ovr));
  const nec={};
  for(const pos in porPos){
    const arr=porPos[pos].sort((a,b)=>b-a);
    const melhor=arr[0]||40, prof=arr.length;
    nec[pos]=clamp((80-melhor)*1.6 + (prof<2?18:prof<3?6:0), 0, 100);
  }
  return nec;
}
function scoreAlvo(alvo, meu, nec, objetivo){
  const meusNaPos=meu.elenco.filter(p=>p.pos===alvo.pos).sort((a,b)=>b.ovr-a.ovr);
  const meuMelhorPos=meusNaPos[0]?meusNaPos[0].ovr:40;
  const ganho=alvo.ovr-meuMelhorPos;
  const cobre=nec[alvo.pos]||0;
  const custoRel = alvo.ovr / Math.max(1, alvo.salario/1e6);
  const upside = alvo.pot - alvo.ovr;
  switch(objetivo){
    case 'custo':     return custoRel*8 + ganho*1.5 - alvo.salario/4e6;
    case 'potencial': return (alvo.idade<=24? upside*4 + (99-alvo.idade)*0.5 : -50) + alvo.ovr*0.3;
    case 'estrela':   return alvo.ovr>=82? alvo.ovr*2 + ganho*3 : alvo.ovr-60;
    case 'lacuna':    return cobre*2 + ganho*2.5;
    case 'picks':     return ganho*2 + cobre*0.5;
    case 'auto':
    default:          return ganho*3 + cobre*1.2 + upside*0.5;
  }
}
function buscarOportunidades(objetivo, n, alcance){
  const meu=S.times[S.meuTime];
  const nec=necessidades(meu);
  const ops=[];
  S.times.forEach(outro=>{
    if(outro.id===S.meuTime) return;
    outro.elenco.forEach(alvo=>{
      if(alvo.ovr<58) return;
      if(objetivo==='potencial' && (alvo.idade>25 || alvo.pot-alvo.ovr<4)) return;
      if(objetivo==='estrela' && alvo.ovr<80) return;
      const valAlvo=valorMercado(alvo);
      const querPicks = objetivo==='picks';
      const oferta=montarOfertaViavel(meu, outro, [alvo], valAlvo, querPicks);
      if(!oferta) return;
      const meusNaPos=meu.elenco.filter(p=>p.pos===alvo.pos).sort((a,b)=>b.ovr-a.ovr);
      const ganho=alvo.ovr-(meusNaPos[0]?meusNaPos[0].ovr:40);
      // só sugere se melhora de fato o time (ganho posicional OU cobre lacuna OU joia jovem)
      const relevante = ganho>0 || (nec[alvo.pos]||0)>35 || (alvo.idade<=23 && alvo.pot-alvo.ovr>=6);
      if(!relevante) return;
      const sc=scoreAlvo(alvo,meu,nec,objetivo) - oferta.custoOvr*1.2 + (oferta.picksRecebidos?oferta.picksRecebidos.length*6:0);
      ops.push({
        outroId:outro.id, recebo:[alvo], entrego:oferta.jogadores,
        picksRecebo: oferta.picksRecebidos||[], picksEntrego: oferta.picksEnviados||[],
        ganhoOvr:ganho, cobre:Math.round(nec[alvo.pos]||0), score:sc,
        salLiquido: alvo.salario - oferta.jogadores.reduce((s,p)=>s+p.salario,0)
      });
    });
  });
  const vistos=new Set(); const unicas=[];
  ops.sort((a,b)=>b.score-a.score);
  for(const o of ops){ const k=o.recebo[0].id; if(vistos.has(k))continue;vistos.add(k);unicas.push(o); }
  return unicas.slice(0, alcance).slice(0, n);
}
function montarOfertaViavel(meu, outro, recebo, valAlvo, querPicks){
  const exig = 1.08 + (outro.prestigio>80?0.08:0);
  let alvoValor = valAlvo*exig;
  const candidatos=meu.elenco.filter(p=>!recebo.includes(p))
    .map(p=>{
      const naPos=meu.elenco.filter(x=>x.pos===p.pos).sort((a,b)=>b.ovr-a.ovr);
      const rank=naPos.indexOf(p);
      return {p, disp: rank*10 + (100-p.ovr)*0.3, val:valorMercado(p)};
    })
    .sort((a,b)=>b.disp-a.disp);
  let picksRecebidos=[];
  if(querPicks){
    const picksOutro=picksDe(outro.id).filter(pk=>pk.rodada===1).sort((a,b)=>valorPick(b)-valorPick(a));
    if(picksOutro.length){ picksRecebidos=[picksOutro[0]]; alvoValor += valorPick(picksOutro[0])*exig; }
  }
  let melhor=null;
  for(let n=1;n<=3;n++){
    const combo=melhorCombo(candidatos, n, alvoValor);
    if(combo){
      const custoOvr=combo.reduce((s,c)=>s+Math.max(0,c.p.ovr-62),0)/combo.length;
      melhor={jogadores:combo.map(c=>c.p), valor:combo.reduce((s,c)=>s+c.val,0), custoOvr,
              picksRecebidos: picksRecebidos.length?picksRecebidos:null, picksEnviados:null};
      break;
    }
  }
  if(!melhor){
    const meusPicks=picksDe(meu.id).filter(pk=>pk.rodada===1).sort((a,b)=>valorPick(a)-valorPick(b));
    const combo1=melhorCombo(candidatos,1,alvoValor*0.6);
    if(combo1 && meusPicks.length){
      const valJog=combo1.reduce((s,c)=>s+c.val,0);
      const falta=alvoValor-valJog;
      let picksEnv=[], soma=0;
      for(const pk of meusPicks.reverse()){ if(soma>=falta)break; picksEnv.push(pk); soma+=valorPick(pk); }
      if(valJog+soma>=alvoValor){
        melhor={jogadores:combo1.map(c=>c.p), valor:valJog+soma,
                custoOvr:combo1.reduce((s,c)=>s+Math.max(0,c.p.ovr-62),0)/combo1.length,
                picksRecebidos:picksRecebidos.length?picksRecebidos:null, picksEnviados:picksEnv};
      }
    }
  }
  if(melhor){
    const nMeu=meu.elenco.length - melhor.jogadores.length + recebo.length;
    const nOutro=outro.elenco.length - recebo.length + melhor.jogadores.length;
    if(nMeu<9||nMeu>15||nOutro<9||nOutro>15) return null;
  }
  return melhor;
}
function melhorCombo(cands, n, alvoValor){
  const ordenado=[...cands].sort((a,b)=>b.val-a.val);
  for(let i=0;i<ordenado.length;i++){
    if(n===1){ if(ordenado[i].val>=alvoValor) return [ordenado[i]]; }
    else if(n===2){
      for(let j=i+1;j<ordenado.length;j++) if(ordenado[i].val+ordenado[j].val>=alvoValor) return [ordenado[i],ordenado[j]];
    } else {
      for(let j=i+1;j<ordenado.length;j++)for(let k=j+1;k<ordenado.length;k++)
        if(ordenado[i].val+ordenado[j].val+ordenado[k].val>=alvoValor) return [ordenado[i],ordenado[j],ordenado[k]];
    }
  }
  return null;
}

/* ---------- atualização contínua (chamada a cada rodada) ---------- */
function atualizarOlheiro(){
  // sugestões GRÁTIS: sempre 2, objetivo automático, atualiza a cada rodada
  S.scoutFree = buscarOportunidades('auto', 2, 16);
  // olheiro CONTRATADO: se tem contrato ativo nesta temporada, atualiza a lista
  if(S.scoutContrato && S.scoutContrato.temp===S.temporada){
    const nv=SCOUT_NIVEIS[S.scoutContrato.nivel];
    const obj=S.scoutContrato.obj||'auto';
    S.scoutContrato.ops = buscarOportunidades(obj, nv.n, nv.alcance);
  }
}
function contratarOlheiroAnual(nivel){
  const meu=S.times[S.meuTime];
  const nv=SCOUT_NIVEIS[nivel];
  if(meu.caixa<nv.custo){alert('Caixa insuficiente para contratar '+nv.nome+'.');return;}
  meu.caixa-=nv.custo;
  S.scoutContrato={temp:S.temporada, nivel, obj:S.scoutObj||'auto', ops:[]};
  atualizarOlheiro();
  noticia('🔍 '+nv.nome+' contratado por toda a temporada '+S.temporada+' ('+$(nv.custo)+'). Ele enviará alvos a cada rodada.','p');
  render();
}
function mudarObjetivoOlheiro(obj){
  S.scoutObj=obj;
  if(S.scoutContrato && S.scoutContrato.temp===S.temporada){S.scoutContrato.obj=obj;atualizarOlheiro();}
  render();
}

function aceitarScout(fonte,alvoId){

   TREINO & DESENVOLVIMENTO
   ============================================================ */
const TREINOS_POR_TEMP = 8; // sessões disponíveis por temporada

// programas de treino: cada um foca em grupos de atributos + efeito no potencial
const PROGRAMAS = {
  arremesso:  {nome:'Arremesso',  desc:'Sobe bola de 3, arremesso médio e lance livre', at:['arr3','arr2','ll']},
  finalizacao:{nome:'Finalização',desc:'Sobe finalização, arremesso médio e atletismo', at:['fin','arr2','atl']},
  criacao:    {nome:'Criação',    desc:'Sobe passe, drible e QI de jogo', at:['passe','drible','qi']},
  defesa:     {nome:'Defesa',     desc:'Sobe defesa de perímetro, interior e rebote', at:['defP','defI','reb']},
  fisico:     {nome:'Físico',     desc:'Sobe atletismo, resistência e defesa interior', at:['atl','res','defI']},
  potencial:  {nome:'Desenvolvimento',desc:'Foca em elevar o teto (potencial) de jovens', at:[], pot:true},
};
const PROG_KEYS=Object.keys(PROGRAMAS);

// ganho de treino depende da idade (jovens crescem mais) e da margem até o potencial
function ganhoTreino(p, prog){
  const jovem = p.idade<=21?1.6 : p.idade<=24?1.25 : p.idade<=27?0.9 : p.idade<=30?0.55 : 0.3;
  const margem = clamp((p.pot - p.ovr)/12, 0.15, 1); // perto do teto rende menos
  if(prog.pot){
    // desenvolvimento: chance de subir o potencial (só vale a pena em jovens)
    const chance = p.idade<=20?0.75 : p.idade<=22?0.55 : p.idade<=24?0.35 : p.idade<=26?0.15 : 0.03;
    return {tipo:'pot', chance, delta: RI(1,3)};
  }
  // treino de atributos: sobe 1-3 pontos nos atributos do programa, escalado por idade/margem
  const forca = jovem * (0.6 + margem);
  return {tipo:'at', forca};
}
function aplicarTreino(pid, progKey){
  if(S.treinosRest<=0) return 'Sem sessões de treino restantes nesta temporada.';
  const t=S.times[S.meuTime];
  const p=t.elenco.find(x=>x.id===pid);
  if(!p) return 'Jogador não encontrado.';
  const prog=PROGRAMAS[progKey];
  const g=ganhoTreino(p, prog);
  let msg;
  if(g.tipo==='pot'){
    if(Math.random()<g.chance){
      p.pot=clamp(p.pot+g.delta, p.ovr, 99);
      msg='📈 '+p.nome.split(' ').pop()+' evoluiu! Potencial +'+g.delta+' (agora '+p.pot+')';
    } else {
      // consolação: pequeno ganho de forma/QI
      p.at.qi=clamp(p.at.qi+1,20,99); p.ovr=calcOvr(p);
      msg='🏋 '+p.nome.split(' ').pop()+' treinou, mas o potencial não subiu desta vez (+1 QI)';
    }
  } else {
    let subiu=0;
    prog.at.forEach(k=>{
      // não passa do potencial em nenhum atributo individual (teto suave = pot)
      const teto = Math.min(99, p.pot+4);
      const inc = Math.round(g.forca * (Math.random()<0.5?1:2));
      if(inc>0 && p.at[k]<teto){ p.at[k]=clamp(p.at[k]+inc, 20, teto); subiu+=inc; }
    });
    const antes=p.ovr; p.ovr=calcOvr(p);
    const dovr=p.ovr-antes;
    p.moral=clamp(p.moral+2,0,100);
    msg='🏋 '+p.nome.split(' ').pop()+' treinou '+prog.nome.toLowerCase()+
        (dovr>0?' — overall +'+dovr+' (agora '+p.ovr+')':' — atributos +'+subiu);
  }
  // limita ganhos abusivos: cada jogador pode receber no máx. 3 treinos por temporada
  S.treinos[pid]=(S.treinos[pid]||0)+1;
  S.treinosRest--;
  noticia(msg,'v');
  return null;
}

  const folhaProjetada = folha(t) - (n.mesmoTime?p.salario:0) + n.salario;
  if(!n.mesmoTime && folhaProjetada>TETO){ n.feedback={ok:false,msg:'Não é possível contratar agente livre acima do teto salarial.'}; renderNegoc(); return; }
  // avaliação do jogador

  if(!av.ok){ n.feedback=av; renderNegoc(); return; }
  // aceito! aplica
  if(n.mesmoTime && folhaProjetada>TETO){

    t.caixa-=imposto;

  if(n.origem==='livre'){

    p.time=t.id; t.elenco.push(p); t.elenco.sort((a,b)=>b.ovr-a.ovr);

  noticia('✍ '+p.nome+' assinou '+n.anos+' ano(s) por '+$(n.salario)+'/ano'+(n.mesmoTime?' (renovação)':''),'v');

  const sub=S.premSub||'temporada';
  const tabBtn=(k,nome)=>`<button class="btn ${sub===k?'':'ghost'} mini" onclick="S.premSub='${k}';render()">${nome}</button>`;
  let corpo='';
  if(sub==='temporada') corpo=premiosTemporadaUI();
  else if(sub==='historico') corpo=premiosHistoricoUI();
  else corpo=camisasUI();
  return `<h2 class="sec">Prêmios & Legado</h2>
    <div class="row" style="margin-bottom:14px">${tabBtn('temporada','🏆 Última temporada')}${tabBtn('historico','📜 Histórico')}${tabBtn('camisas','🎽 Camisas aposentadas')}</div>
    ${corpo}`;
}
function premioCard(titulo,pr,cor){
  if(!pr) return `<div class="card"><div class="hint">${titulo}</div><div class="muted">—</div></div>`;
  return `<div class="card" style="border-left:3px solid ${cor||'var(--wood)'}">
    <div class="hint">${titulo}</div>
    <div class="big" style="font-size:17px">${esc(pr.nome)}</div>
    <div class="row" style="justify-content:space-between"><span class="pill">${esc(pr.ab)}</span><span class="muted">${esc(pr.linha||'')}</span></div>
  </div>`;
}
function premiosTemporadaUI(){
  const p=(S.premiacoes||[])[0];
  if(!p) return `<div class="card"><p class="hint">Os prêmios são entregues ao fim de cada temporada regular. Jogue a primeira temporada para ver os vencedores.</p></div>`;
  return `<div class="card accent" style="margin-bottom:14px"><h3 class="sub">Prêmios da temporada ${p.temp}</h3></div>
    <div class="grid g3">
      ${premioCard('🏆 MVP',p.mvp,'var(--amber)')}
      ${premioCard('🛡 Melhor Defensor',p.dpoy,'var(--blue)')}
      ${premioCard('🌟 Novato do Ano',p.roy,'var(--green)')}
    </div>
    <div class="grid g3" style="margin-top:10px">
      ${premioCard('🎯 Cestinha',p.cestinha)}
      ${premioCard('💪 Rei dos Rebotes',p.rebotes)}
      ${premioCard('🎩 Rei das Assistências',p.assist)}
    </div>
    <h3 class="sub" style="margin-top:18px">Time Ideal da Temporada</h3>
    ${p.timeIdeal.map((q,i)=>`
      <div class="card" style="margin-top:8px">
        <div class="hint" style="margin-bottom:6px">${['1º Time Ideal','2º Time Ideal','3º Time Ideal'][i]}</div>
        <div class="grid g5">${q.filter(Boolean).map(x=>`
          <div style="text-align:center"><div class="pill">${bd(x.pos)}</div>
          <div style="font-weight:700;font-size:13px;margin-top:3px">${esc(x.nome.split(' ').slice(-1)[0])}</div>
          <div class="muted" style="font-size:11px">${esc(x.ab)}</div></div>`).join('')}</div>
      </div>`).join('')}`;
}
function premiosHistoricoUI(){
  const hist=S.premiacoes||[];
  if(!hist.length) return `<div class="card"><p class="hint">Ainda não há histórico de prêmios.</p></div>`;
  return `<div class="card tbl-wrap"><h3 class="sub">Vencedores por temporada</h3>
    <table><thead><tr><th>Temp.</th><th>MVP</th><th>Defensor</th><th>Novato</th><th>Cestinha</th></tr></thead>
    <tbody>${hist.map(p=>`<tr>
      <td>${p.temp}</td>
      <td class="name">${p.mvp?esc(p.mvp.nome)+' <span class="muted">('+p.mvp.ab+')</span>':'—'}</td>
      <td>${p.dpoy?esc(p.dpoy.nome):'—'}</td>
      <td>${p.roy?esc(p.roy.nome):'—'}</td>
      <td>${p.cestinha?esc(p.cestinha.nome):'—'}</td></tr>`).join('')}</tbody></table></div>`;
}
function camisasUI(){
  const cam=S.camisas||{};
  const times=Object.keys(cam).filter(ab=>cam[ab]&&cam[ab].length).sort();
  // filtro por time
  const filtro=S.camisaFiltro||'TODOS';
  const abs=S.times.map(t=>t.ab).sort();
  let corpo;
  if(!times.length){
    corpo=`<p class="hint">Nenhuma camisa aposentada ainda. Quando lendas (MVPs, múltiplos Times Ideais, campeões) se aposentam, o último time delas eterniza o número aqui.</p>`;
  } else {
    const mostrar = filtro==='TODOS'? times : times.filter(ab=>ab===filtro);
    corpo = mostrar.length? mostrar.map(ab=>`
      <div class="card" style="margin-top:8px"><h3 class="sub">${esc(ab)} · ${cam[ab].length} camisa(s)</h3>
        <div class="grid g3">${cam[ab].map(c=>`
          <div class="card" style="text-align:center;border-top:3px solid var(--amber)">
            <div class="big" style="font-size:28px;color:var(--amber)">#${c.numero}</div>
            <div style="font-weight:700">${esc(c.nome)}</div>
            <div class="muted" style="font-size:11px">${POSNM[c.pos]||c.pos} · pico ${c.ovrPico} ovr</div>
            <div class="hint" style="margin-top:4px">${c.mvp?'🏆'+c.mvp+' MVP · ':''}${c.allnba?'⭐'+c.allnba+' Time Ideal':''}${!c.mvp&&!c.allnba?'lenda da franquia':''}</div>
          </div>`).join('')}</div>
      </div>`).join('') : `<p class="hint">Nenhuma camisa aposentada nesse time ainda.</p>`;
  }
  return `<div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <h3 class="sub" style="margin:0">Camisas aposentadas</h3>
      <select onchange="S.camisaFiltro=this.value;render()">
        <option value="TODOS">Todos os times</option>
        ${abs.map(ab=>`<option value="${ab}" ${filtro===ab?'selected':''}>${ab}</option>`).join('')}</select>
    </div>
    ${corpo}
  </div>`;
}
/* ============================================================
   BOOT · SETUP · SAVE
   ============================================================ */
const CHAVE='parque26:save';
var salvarTimer=null, MEM=null;
async function storageSet(k,v){
  try{ if(window.storage&&window.storage.set){await window.storage.set(k,v);return true;} }catch(e){}
  try{ if(window.localStorage){localStorage.setItem(k,v);return true;} }catch(e){}
  MEM=v; return false;
}
async function storageGet(k){
  try{ if(window.storage&&window.storage.get){const r=await window.storage.get(k);if(r&&r.value)return r.value;} }catch(e){}
  try{ if(window.localStorage){const v=localStorage.getItem(k);if(v)return v;} }catch(e){}
  return MEM;
}
function salvar(){
  clearTimeout(salvarTimer);
  salvarTimer=setTimeout(async()=>{
    try{ await storageSet(CHAVE, JSON.stringify({...S, pid:PID})); if(typeof flashSalvo==='function')flashSalvo(); }catch(e){console.warn('save falhou',e);}
  },1200);
}
async function carregar(){
  const raw=await storageGet(CHAVE);
  if(!raw){alert('Nenhum jogo salvo encontrado.');return;}
  try{
    const d=JSON.parse(raw);
    PID=d.pid||1000; delete d.pid; S=d;
    migrarSave();
    entrarNoJogo();
  }catch(e){alert('Save corrompido.');console.error(e);}
}

/* ---------- EXPORTAR / IMPORTAR SAVE (ponte entre versões/arquivos) ---------- */
// gera um código de texto a partir do estado atual (ou do save guardado, no menu inicial)
async function exportarSave(){
  let obj;
  if(S){ obj = {...S, pid:PID}; }
  else { const raw=await storageGet(CHAVE); obj = raw? JSON.parse(raw):null; }
  if(!obj){ alert('Nenhum jogo para exportar. Comece ou carregue uma carreira primeiro.'); return; }
  // remove dados que são recriados na importação (encolhe muito o código)
  const enxuto = {...obj};
  delete enxuto.ultimoJogo;   // súmula do último jogo (grande)
  delete enxuto.scoutFree;    // sugestões do olheiro (recriadas)
  if(enxuto.scoutContrato) enxuto.scoutContrato={...enxuto.scoutContrato, ops:[]};
  // resultados do calendário viram só placares mínimos; o calendário é regenerado
  enxuto._calMeta = {rodada: obj.rodada, temporada: obj.temporada};
  delete enxuto.cal;          // calendário regenerado na importação
  const payload = JSON.stringify(enxuto);
  const codigo = 'PARQUE26|' + btoa(unescape(encodeURIComponent(payload)));
  mostrarCaixaCodigo('Exportar carreira', codigo,
    'Copie TODO o texto abaixo e guarde. Na outra versão do jogo, use "Importar código" e cole isto. O calendário da temporada atual será regerado — os resultados dos seus jogos e a classificação são preservados.');
}
function importarSave(){
  mostrarCaixaImport('Importar carreira',
    'Cole aqui o código exportado da outra versão e clique em Carregar.');
}
function processarImport(codigo){
  try{
    codigo = (codigo||'').trim();
    if(codigo.startsWith('PARQUE26|')) codigo = codigo.slice('PARQUE26|'.length);
    const json = decodeURIComponent(escape(atob(codigo)));
    const d = JSON.parse(json);
    if(!d.times || !Array.isArray(d.times) || d.times.length!==30) throw new Error('estrutura inválida');
    PID = d.pid||1000; delete d.pid; S = d;
    migrarSave();
    salvar();               // grava também no armazenamento desta versão
    fecharCaixa();
    entrarNoJogo();
    noticia('📥 Carreira importada com sucesso.','p');
    render();
  }catch(e){
    alert('Código inválido ou corrompido. Confira se copiou o texto completo.\n\nDetalhe: '+e.message);
  }
}
// caixinhas simples reaproveitando o modal existente
function mostrarCaixaCodigo(titulo, codigo, ajuda){
  el('mTitle').textContent=titulo;
  el('mBody').innerHTML=`<p class="hint" style="margin-bottom:10px">${ajuda}</p>
    <textarea id="codeBox" readonly style="width:100%;height:180px;font-family:var(--mono);font-size:11px;background:var(--bg2);color:var(--bone);border:1px solid var(--line);padding:8px">${codigo}</textarea>
    <div class="row" style="margin-top:10px"><button class="btn" onclick="copiarCodigo()">Copiar código</button>
    <button class="btn ghost" onclick="closeModal()">Fechar</button></div>`;
  el('modal').classList.add('on');
}
function mostrarCaixaImport(titulo, ajuda){
  el('mTitle').textContent=titulo;
  el('mBody').innerHTML=`<p class="hint" style="margin-bottom:10px">${ajuda}</p>
    <textarea id="importBox" placeholder="Cole o código aqui..." style="width:100%;height:180px;font-family:var(--mono);font-size:11px;background:var(--bg2);color:var(--bone);border:1px solid var(--line);padding:8px"></textarea>
    <div class="row" style="margin-top:10px"><button class="btn" onclick="processarImport(document.getElementById('importBox').value)">Carregar carreira</button>
    <button class="btn ghost" onclick="closeModal()">Cancelar</button></div>`;
  el('modal').classList.add('on');
}
function copiarCodigo(){
  const box=el('codeBox'); if(!box)return;
  box.select(); box.setSelectionRange(0,999999);
  try{ document.execCommand('copy'); }catch(e){}
  if(navigator.clipboard){ navigator.clipboard.writeText(box.value).catch(()=>{}); }
  alert('Código copiado! Guarde num lugar seguro e cole na outra versão.');
}
function fecharCaixa(){ el('modal').classList.remove('on'); }
// preenche campos que podem faltar em saves de versões anteriores (evita crashes)
function migrarSave(){
  S.times.forEach(t=>{
    if(!t.tatica)t.tatica={ritmo:1,foco:1,pressao:1};
    if(!t.minutos)t.minutos=autoMinutos(t);
    if(!t.hist)t.hist=[];
  });
  if(!S.livres)S.livres=[];
  if(!S.draft)S.draft=[];
  if(S.draftPick===undefined)S.draftPick=0;
  if(!S.ordemDraft)S.ordemDraft=[];
  if(!S.noticias)S.noticias=[];
  if(!S.treinos)S.treinos={};
  if(S.treinosRest===undefined)S.treinosRest=(typeof TREINOS_POR_TEMP!=='undefined'?TREINOS_POR_TEMP:8);
  if(!S.picks || !S.picks.length){ if(typeof inicializarPicks==='function') inicializarPicks(); }
  if(typeof PICKID==='undefined' || PICKID<2){ PICKID=(S.picks||[]).reduce((m,p)=>Math.max(m,+String(p.id).slice(1)||0),0)+1; }
  if(!S.scoutFree)S.scoutFree=[];
  if(!S.propostas)S.propostas=[];
  if(!S.premiacoes)S.premiacoes=[];
  if(!S.camisas)S.camisas={};
  if(typeof initCarreira==='function')initCarreira();
  // regenera o calendário se foi removido na exportação (código enxuto)
  if(!S.cal || !S.cal.length){
    S.cal = gerarCalendario(S.times);
    // reposiciona a rodada com base em quantos jogos o meu time já fez
    if(S.fase==='regular'){
      const jogados = S.times[S.meuTime].v + S.times[S.meuTime].d;
      // marca como "já disputadas" as rodadas iniciais até cobrir os jogos do usuário
      let contaMeu=0, r=0;
      while(r<S.cal.length && contaMeu<jogados){
        const rod=S.cal[r];
        rod.forEach(j=>{ j.res=[0,0]; }); // placar placeholder (resultado real preservado em t.v/t.d)
        if(rod.some(j=>j.c===S.meuTime||j.f===S.meuTime)) contaMeu++;
        r++;
      }
      S.rodada = r;
    } else {
      S.rodada = S.cal.length; // fora da fase regular, calendário já se encerrou
    }
    delete S._calMeta;
  }
  if(typeof atualizarOlheiro==='function')atualizarOlheiro();
}

/* ---------- SETUP ---------- */
var PREVIEW=null, escolhido=null;
function montarSetup(){
  PREVIEW=criarLiga();
  const g=el('teamPick');
  const ord=[...PREVIEW].sort((a,b)=>forcaTime(b)-forcaTime(a));
  g.innerHTML=ord.map(t=>{
    const tit=(typeof CAMPEOES!=='undefined'&&CAMPEOES[t.ab])?` · 🏆${CAMPEOES[t.ab][0]}`:'';
    const est=[...t.elenco].sort((x,y)=>y.ovr-x.ovr)[0];
    return `<button data-i="${t.id}" style="border-left:3px solid ${t.cor||'var(--line)'}">
    <div class="cty">${esc(t.cidade)} · ${t.conf==='L'?'Leste':'Oeste'}${tit}</div>
    <div class="nk">${esc(t.nick)}</div>
    <div class="fr">força ${forcaTime(t)} · ${esc(est.nome.split(' ').slice(-1)[0])} ${est.ovr}</div></button>`;}).join('');
  g.querySelectorAll('button').forEach(b=>b.onclick=()=>{
    g.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));
    b.classList.add('sel'); escolhido=+b.dataset.i; el('startBtn').disabled=false;
  });
}
function iniciarCarreira(){
  if(escolhido===null)return;
  S={
    tecnico: el('coachName').value||'Treinador',
    meuTime: escolhido, times: PREVIEW, temporada: 2027,
    cal:[], rodada:0, fase:'regular',
    livres:[], draft:[], draftPick:0, ordemDraft:[], picks:[],
    treinos:{}, treinosRest:0,
    noticias:[], po:null, ultimoJogo:null, objetivo:{txt:'',nivel:1}, avisos:0, demitido:false
  };
  // pool inicial de agentes livres (veteranos disponíveis no mercado)
  S.cal=gerarCalendario(S.times);
  inicializarPicks();
  gerarAgentesLivresIniciais();
  S.treinosRest = TREINOS_POR_TEMP;
  S.times.forEach(t=>{t.minutos=autoMinutos(t);});
  definirObjetivo();
  if(typeof initCarreira==='function')initCarreira();
  S.propostas=[];
  S.premiacoes=[];
  S.camisas={};
  if(typeof atualizarOlheiro==='function')atualizarOlheiro();
  noticia('🏀 Bem-vindo, '+S.tecnico+'. Temporada 2026-27 começando com '+S.times[S.meuTime].cidade+' '+S.times[S.meuTime].nick+'.','p');
  noticia('🎯 Objetivo da diretoria: '+S.objetivo.txt,'p');
  entrarNoJogo();
}
function entrarNoJogo(){
  el('setup').classList.add('hidden');
  el('shell').classList.remove('hidden');
  ABA='inicio'; montarTabs(); render();
}
function novoJogo(){location.reload();}

/* ---------- AUTO-SAVE reforçado ---------- */
// salva na hora, sem debounce (para momentos críticos: app indo pra segundo plano, fechar)
async function salvarAgora(){
  if(!S) return;
  clearTimeout(salvarTimer);
  try{
    await storageSet(CHAVE, JSON.stringify({...S, pid:PID}));
    flashSalvo();
  }catch(e){console.warn('save falhou',e);}
}
// pequeno indicador visual "salvo ✓" no canto
function flashSalvo(){
  let el=document.getElementById('saveflash');
  if(!el){
    el=document.createElement('div'); el.id='saveflash';
    el.style.cssText='position:fixed;bottom:14px;right:14px;z-index:9999;background:rgba(20,20,20,.92);'
      +'color:#7ac77a;border:1px solid rgba(122,199,122,.4);padding:6px 12px;border-radius:8px;'
      +'font:600 12px/1 system-ui,sans-serif;letter-spacing:.5px;opacity:0;transition:opacity .25s;pointer-events:none';
    el.textContent='✓ salvo';
    document.body.appendChild(el);
  }
  el.style.opacity='1';
  clearTimeout(el._t);
  el._t=setTimeout(()=>{el.style.opacity='0';},1100);
}
// salva ao minimizar/fechar o app (essencial num app instalado, que pode ser encerrado a qualquer hora)
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='hidden') salvarAgora(); });
window.addEventListener('pagehide', salvarAgora);
window.addEventListener('beforeunload', ()=>{ if(S){ try{ localStorage.setItem(CHAVE, JSON.stringify({...S, pid:PID})); }catch(e){} } });

el('startBtn').onclick=iniciarCarreira;
el('loadBtn').onclick=carregar;
el('importBtn').onclick=importarSave;
el('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();});
montarSetup();

/* ---------- PWA: registra o service worker (offline + instalável) ---------- */
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  });
}
