<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PARQUÊ '26 — Manager de Basquete</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c8792e">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#0c0a09;
  --bg2:#141110;
  --panel:#1b1715;
  --panel2:#221d1a;
  --line:#332b26;
  --wood:#c8792e;
  --wood-lo:#8a5220;
  --amber:#e8a33d;
  --bone:#f3ede2;
  --mute:#9a8d80;
  --red:#d8402f;
  --green:#4faa5a;
  --blue:#4a8fd4;
  --display:'Anton','Haettenschweiler','Impact','Arial Narrow Bold',sans-serif;
  --ui:'Barlow Condensed','Oswald','Arial Narrow',sans-serif;
  --mono:'IBM Plex Mono','SFMono-Regular',Menlo,Consolas,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);
  color:var(--bone);
  font-family:var(--ui);
  font-size:16px;
  -webkit-font-smoothing:antialiased;
  background-image:
    repeating-linear-gradient(90deg,rgba(255,255,255,.012) 0 2px,transparent 2px 7px),
    radial-gradient(1100px 500px at 50% -10%,rgba(200,121,46,.13),transparent 70%);
}
::selection{background:var(--wood);color:#150f0a}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#0c0a09}
::-webkit-scrollbar-thumb{background:#3b312b;border-radius:0}
::-webkit-scrollbar-thumb:hover{background:var(--wood-lo)}

/* ---------- SHELL ---------- */
#shell{max-width:1180px;margin:0 auto;padding:0 14px 60px}
header.top{
  display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  padding:14px 0 12px;border-bottom:2px solid var(--wood);
  position:sticky;top:0;z-index:40;
  background:linear-gradient(180deg,#0c0a09 72%,rgba(12,10,9,.86) 100%);
  backdrop-filter:blur(6px);
}
.brand{font-family:var(--display);font-size:30px;letter-spacing:.5px;line-height:1;color:var(--bone)}
.brand em{color:var(--wood);font-style:normal}
.brand small{display:block;font-family:var(--ui);font-size:10px;letter-spacing:3px;color:var(--mute);font-weight:600}
.hudwrap{display:flex;gap:10px;margin-left:auto;flex-wrap:wrap}
.hud{
  border:1px solid var(--line);background:var(--panel);
  padding:5px 11px;min-width:88px;
}
.hud b{display:block;font-family:var(--mono);font-size:14px;font-weight:600;letter-spacing:-.3px}
.hud span{font-size:10px;letter-spacing:2px;color:var(--mute);text-transform:uppercase;font-weight:600}
.hud.pos b{color:var(--green)} .hud.neg b{color:var(--red)}

nav.tabs{display:flex;gap:2px;overflow-x:auto;padding:10px 0;border-bottom:1px solid var(--line);position:sticky;top:66px;z-index:30;background:var(--bg)}
nav.tabs button{
  font-family:var(--ui);font-size:14px;font-weight:600;letter-spacing:1.4px;text-transform:uppercase;
  background:transparent;color:var(--mute);border:1px solid transparent;
  padding:7px 13px;cursor:pointer;white-space:nowrap;transition:.15s;
}
nav.tabs button:hover{color:var(--bone);background:var(--panel)}
nav.tabs button.on{color:#150f0a;background:var(--wood);border-color:var(--wood)}

main{padding-top:20px;animation:rise .3s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- BLOCOS ---------- */
h2.sec{
  font-family:var(--display);font-size:24px;letter-spacing:.5px;margin-bottom:12px;
  display:flex;align-items:center;gap:10px;text-transform:uppercase;
}
h2.sec:before{content:"";width:5px;height:22px;background:var(--wood);display:block}
h3.sub{font-family:var(--ui);font-size:12px;letter-spacing:2.4px;text-transform:uppercase;color:var(--mute);font-weight:700;margin-bottom:8px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,1fr)}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.g5{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
@media(max-width:820px){.g2,.g3,.g4,.g5{grid-template-columns:repeat(2,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);padding:14px}
.card.accent{border-left:4px solid var(--wood)}
.muted{color:var(--mute)}
.mono{font-family:var(--mono)}
.big{font-family:var(--display);font-size:34px;line-height:1}

/* ---------- TABELAS ---------- */
table{width:100%;border-collapse:collapse;font-size:14px}
th{
  font-size:10px;letter-spacing:1.6px;text-transform:uppercase;color:var(--mute);
  text-align:right;padding:6px 6px;border-bottom:1px solid var(--line);font-weight:700;white-space:nowrap;
}
th:first-child,td:first-child{text-align:left}
td{padding:6px 6px;border-bottom:1px solid rgba(51,43,38,.5);text-align:right;font-family:var(--mono);font-size:13px;white-space:nowrap}
td.name{font-family:var(--ui);font-size:15px;font-weight:500;text-align:left}
tr.me td{background:rgba(200,121,46,.11)}
tr.clickable{cursor:pointer}
tr.clickable:hover td{background:rgba(232,163,61,.09)}
.tbl-wrap{overflow-x:auto}

/* ---------- BOTOES ---------- */
button.btn{
  font-family:var(--ui);font-weight:700;letter-spacing:1.6px;text-transform:uppercase;font-size:13px;
  background:var(--wood);color:#150f0a;border:none;padding:10px 18px;cursor:pointer;transition:.15s;
}
button.btn:hover{background:var(--amber)}
button.btn:disabled{background:#3a322c;color:#736659;cursor:not-allowed}
button.ghost{background:transparent;color:var(--bone);border:1px solid var(--line)}
button.ghost:hover{background:var(--panel2);border-color:var(--wood)}
button.mini{padding:4px 9px;font-size:11px;letter-spacing:1px}
button.danger{background:var(--red);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

select,input[type=text],input[type=number]{
  font-family:var(--mono);font-size:13px;background:var(--bg2);color:var(--bone);
  border:1px solid var(--line);padding:6px 8px;
}
input[type=range]{accent-color:var(--wood);width:100%}

.badge{display:inline-block;font-size:10px;letter-spacing:1.4px;font-weight:700;padding:2px 6px;text-transform:uppercase}
.b-pg{background:#2f4f7a;color:#cfe4ff}.b-sg{background:#2f6b6b;color:#c9f2ee}
.b-sf{background:#6b5a2f;color:#f6e6bd}.b-pf{background:#6b3a2f;color:#ffd8c9}
.b-c{background:#5a2f6b;color:#ecd0ff}
.tag{font-size:10px;letter-spacing:1.2px;padding:2px 5px;border:1px solid var(--line);color:var(--mute);text-transform:uppercase}
.inj{color:var(--red);font-weight:700}
.ovr{font-family:var(--display);font-size:18px;line-height:1}
.bar{height:5px;background:#2a2320;position:relative;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--wood);display:block}

/* ---------- MODAL ---------- */
#modal{position:fixed;inset:0;background:rgba(6,4,3,.86);z-index:100;display:none;padding:24px 12px;overflow:auto}
#modal.on{display:block}
.sheet{max-width:960px;margin:0 auto;background:var(--panel);border:1px solid var(--wood);animation:rise .25s ease both}
.sheet-head{display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0}
.sheet-head h3{font-family:var(--display);font-size:22px;text-transform:uppercase;letter-spacing:.5px}
.sheet-body{padding:16px}
.x{margin-left:auto;background:none;border:1px solid var(--line);color:var(--bone);width:30px;height:30px;cursor:pointer;font-size:16px;line-height:1}
.x:hover{border-color:var(--red);color:var(--red)}

/* ---------- PLACAR ---------- */
.score{display:flex;align-items:center;justify-content:center;gap:20px;padding:16px;background:var(--bg2);border:1px solid var(--line)}
.score .t{text-align:center;flex:1}
.score .t .nm{font-family:var(--ui);font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--mute);font-weight:700}
.score .t .pt{font-family:var(--display);font-size:56px;line-height:1}
.score .t.win .pt{color:var(--amber)}
.score .vs{font-family:var(--mono);font-size:11px;color:var(--mute);letter-spacing:2px}
.qbox{display:flex;gap:1px;justify-content:center;margin-top:8px}
.qbox div{background:var(--panel2);border:1px solid var(--line);padding:3px 9px;font-family:var(--mono);font-size:12px}
.qbox div span{display:block;font-size:9px;color:var(--mute);letter-spacing:1px}
#pbp{max-height:280px;overflow:auto;background:var(--bg2);border:1px solid var(--line);padding:10px;font-family:var(--mono);font-size:12px;line-height:1.65}
#pbp .q{color:var(--amber);font-weight:600;letter-spacing:1px;display:block;margin:8px 0 4px}
#pbp .sc{color:var(--mute)}
#pbp .hi{color:var(--bone)}
#pbp .ev-3{color:var(--amber)}
#pbp .ev-to{color:var(--red)}

/* ---------- NOTICIAS ---------- */
.news{list-style:none;font-size:14px}
.news li{padding:7px 0;border-bottom:1px solid rgba(51,43,38,.6);display:flex;gap:9px}
.news li:before{content:"▸";color:var(--wood)}
.hint{font-size:12px;color:var(--mute);line-height:1.5}
.split{display:grid;grid-template-columns:1fr 320px;gap:16px}
@media(max-width:900px){.split{grid-template-columns:1fr}}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid rgba(51,43,38,.5);font-size:14px}
.kv b{font-family:var(--mono);font-weight:600}
.center{text-align:center}
.pill{display:inline-block;padding:3px 9px;font-size:11px;letter-spacing:1.4px;font-weight:700;text-transform:uppercase;background:var(--panel2);border:1px solid var(--line)}
.pill.w{background:rgba(79,170,90,.16);border-color:#2f5c37;color:#8fe09c}
.pill.l{background:rgba(216,64,47,.14);border-color:#6b2a22;color:#ff9d90}

/* ---------- SETUP ---------- */
#setup{max-width:900px;margin:40px auto;text-align:center}
#setup .logo{font-family:var(--display);font-size:76px;line-height:.9;letter-spacing:-1px}
#setup .logo em{color:var(--wood);font-style:normal}
#setup .sub{font-size:13px;letter-spacing:5px;color:var(--mute);text-transform:uppercase;font-weight:600;margin:6px 0 28px}
.teamgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:6px;margin-top:14px}
.teamgrid button{
  background:var(--panel);border:1px solid var(--line);color:var(--bone);padding:9px;cursor:pointer;
  text-align:left;transition:.15s;font-family:var(--ui);
}
.teamgrid button:hover{border-color:var(--wood);background:var(--panel2);transform:translateX(2px)}
.teamgrid button.sel{border-color:var(--wood);background:rgba(200,121,46,.16)}
.teamgrid .cty{font-size:11px;color:var(--mute);letter-spacing:1.4px;text-transform:uppercase}
.teamgrid .nk{font-size:17px;font-weight:700;letter-spacing:.4px}
.teamgrid .fr{font-family:var(--mono);font-size:11px;color:var(--wood);margin-top:3px}
.teamgrid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.teamsel{background:var(--panel);border:1px solid var(--line);color:var(--bone);padding:9px;cursor:pointer;text-align:left;transition:.15s;font-family:var(--ui)}
.teamsel:hover{border-color:var(--wood);background:var(--panel2);transform:translateX(2px)}
.teamsel .cty{font-size:11px;color:var(--mute);letter-spacing:1.2px;text-transform:uppercase}
.teamsel .nk{font-size:16px;font-weight:700}
.teamsel .fr{font-family:var(--mono);font-size:11px;color:var(--wood);margin-top:3px}
.hidden{display:none!important}
</style>
</head>
<body>

<div id="setup">
  <div class="logo">PARQU<em>Ê</em> '26</div>
  <div class="sub">Simulador de Temporada · Basquete</div>
  <div class="card" style="text-align:left">
    <h3 class="sub">1 · Seu nome de treinador</h3>
    <input type="text" id="coachName" value="" placeholder="Digite seu nome" style="width:100%;font-size:16px;padding:9px">
    <h3 class="sub" style="margin-top:18px">2 · Escolha a franquia</h3>
    <p class="hint">Elenco, orçamento e força mudam por time. Times fracos = desafio maior, mais espaço salarial.</p>
    <div class="teamgrid" id="teamPick"></div>
  </div>
  <div class="row" style="justify-content:center;margin-top:18px">
    <button class="btn" id="startBtn" disabled>Começar carreira</button>
    <button class="btn ghost" id="loadBtn">Carregar jogo salvo</button>
    <button class="btn ghost" id="importBtn">Importar código</button>
  </div>
  <p class="hint" style="margin-top:14px">Franquias e elencos reais da temporada 2026-27. Temporada de 82 jogos, play-in e playoffs.</p>
</div>

<div id="shell" class="hidden">
  <header class="top">
    <div class="brand">PARQU<em>Ê</em> '26<small id="hdTeam">—</small></div>
    <div class="hudwrap" id="hud"></div>
  </header>
  <nav class="tabs" id="tabs"></nav>
  <main id="view"></main>
</div>

<div id="modal"><div class="sheet"><div class="sheet-head"><h3 id="mTitle"></h3><button class="x" onclick="closeModal()">✕</button></div><div class="sheet-body" id="mBody"></div></div></div>

<script>
/* ============================================================
   PARQUÊ '26 — núcleo de dados
   ============================================================ */
const R = (a,b)=>a+Math.random()*(b-a);
const RI = (a,b)=>Math.floor(a+Math.random()*(b-a+1));
const pick = arr=>arr[Math.floor(Math.random()*arr.length)];
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const round=(v,d=0)=>{const f=Math.pow(10,d);return Math.round(v*f)/f;};
// distribuição normal (Box-Muller) para atributos realistas
function gauss(m,s){let u=0,v=0;while(!u)u=Math.random();while(!v)v=Math.random();
  return m+s*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v);}
const M$ = v => (v>=1e6? (v/1e6).toFixed(1)+'M' : v>=1e3? (v/1e3).toFixed(0)+'K' : Math.round(v)) ;
const $ = v => 'US$ '+M$(v);
const pct = (m,a)=> a>0? (100*m/a).toFixed(1) : '0.0';

/* FRANQUIAS e ROSTERS reais definidos em p2b_real.js */


const NOMES = ['Marcus','DeAndre','Tyrese','Jalen','Malik','Cam','Devon','Isaiah','Trey','Darius',
 'Brandon','Xavier','Amari','Elijah','Zaire','Kobe','Jamal','Terrence','Quentin','Dwayne',
 'Julian','Andre','Corey','Bryce','Damon','Keegan','Rashad','Lonnie','Deshawn','Marek',
 'Tobias','Grayson','Immanuel','Obi','Jaden','Ausar','Bilal','Caio','Yago','Vitor',
 'Lucca','Bruno','Rafael','Gustavo','Leo','Enzo','Murilo','Kenji','Diego','Andres'];
const SOBRE = ['Whitfield','Harlow','Sanders','Brookes','Cartwright','Reeves','Kessington','Vance','Okora','Matthers',
 'Sharp','Durant\u2019s','Griffiths','Braunfeld','Nesmith','Sokol','Baynes','Jaques','Wallis','Coleman',
 'Petrov','Doncevic','Jovanovic','Saric','Vukovic','Harmon','Watts','Porter','Wagoner','Simmons',
 'Harkins','Wiggs','Bradford','Sumner','Ellison','Fontaine','Okorie','Kaminski','Diallo','Beaumont',
 'Spring','Terrell','Champs','Livings','Steadman','Ferreira','Barbosa','Machado','Varella','Mendes'];
const POS = ['PG','SG','SF','PF','C'];
const POSNM = {PG:'Armador',SG:'Ala-armador',SF:'Ala',PF:'Ala-pivô',C:'Pivô'};

// pesos de overall por posição
const W = {
 PG:{drible:.17,passe:.17,arr3:.14,arr2:.10,defP:.10,qi:.10,atl:.08,fin:.06,ll:.04,reb:.02,defI:.02},
 SG:{arr3:.19,arr2:.13,fin:.11,drible:.12,passe:.08,defP:.12,atl:.10,qi:.06,ll:.05,reb:.03,defI:.01},
 SF:{arr3:.16,arr2:.12,fin:.12,drible:.08,passe:.08,defP:.13,defI:.05,reb:.10,atl:.10,qi:.05,ll:.01},
 PF:{defI:.16,reb:.18,fin:.16,arr2:.10,arr3:.07,defP:.04,atl:.12,passe:.06,qi:.05,drible:.04,ll:.02},
 C: {defI:.21,reb:.22,fin:.18,arr2:.07,arr3:.02,defP:.02,atl:.12,passe:.06,qi:.05,drible:.03,ll:.02}
};
function calcOvr(p){
  const w=W[p.pos];let s=0,t=0;
  for(const k in w){s+=w[k]*p.at[k];t+=w[k];}
  return clamp(Math.round(s/t),25,99);
}

var PID=1;
const _usados=new Set();
function nomeFicticio(){
  let n,tent=0;
  do{ n=pick(NOMES)+' '+pick(SOBRE); tent++; }while(_usados.has(n)&&tent<50);
  _usados.add(n); return n;
}
function novoJogador(posBase,nivel,idadeMin,idadeMax){
  const pos = posBase || pick(POS);
  const idade = RI(idadeMin||19,idadeMax||36);
  const g = (m,s)=>clamp(Math.round(gauss(m+nivel,s||9)),20,99);
  const alto = pos==='C'||pos==='PF', ext = pos==='PG'||pos==='SG';
  const at = {
    arr2 : g(ext?66:58), arr3 : g(pos==='C'?38: pos==='PF'?55: 64,11),
    ll   : g(alto?66:76,10), fin  : g(alto?72:62),
    drible: g(ext?74:pos==='SF'?62:46,10), passe : g(pos==='PG'?76:pos==='C'?52:58,10),
    defP : g(ext?66:pos==='SF'?64:52,10), defI : g(alto?72:pos==='SF'?56:44,10),
    reb  : g(pos==='C'?80:pos==='PF'?74:pos==='SF'?58:44,10),
    atl  : g(66,11), res : g(68,10), qi : g(64,11)
  };
  const p = {
    id:PID++, nome: nomeFicticio(), pos, idade, at,
    alt: pos==='PG'?RI(180,193):pos==='SG'?RI(188,198):pos==='SF'?RI(196,204):pos==='PF'?RI(201,208):RI(206,218),
    moral:RI(55,85), forma:RI(88,100), lesao:0, lesaoTxt:'',
    times:0, camp:0
  };
  p.arq = ({PG:'PLAY',SG:'SHOT',SF:'3D',PF:'STRE',C:'PROT'})[pos];
  p.ovr = calcOvr(p);
  const teto = idade<=21? RI(6,20) : idade<=24? RI(2,12) : idade<=27? RI(0,5) : 0;
  p.pot = clamp(p.ovr+teto,p.ovr,99);
  p.salario = valorSalarial(p);
  p.anos = RI(1,4);
  p.stats = zeroStats(); p.carreira = zeroStats();
  return p;
}
function valorSalarial(p){
  const base = 1.1e6*Math.pow(Math.max(.2,(p.ovr-45)/10),2.4);
  const jovem = p.idade<=23 ? 1+ (p.pot-p.ovr)*0.012 : p.idade>=33? .78 : 1;
  return Math.round(clamp(base*jovem,1200000,58000000)/100000)*100000;
}
function valorMercado(p){ // pra trocas
  let v = Math.pow(Math.max(0,p.ovr-40),3.15);
  // superestrelas valem desproporcionalmente mais (não se troca MVP por role players)
  if(p.ovr>=90) v*=2.2;
  else if(p.ovr>=85) v*=1.65;
  else if(p.ovr>=80) v*=1.4;
  if(p.idade<=23) v*= 1.35 + (p.pot-p.ovr)*0.02;
  else if(p.idade<=27) v*=1.12; else if(p.idade>=34) v*=.5; else if(p.idade>=32) v*=.62; else if(p.idade>=30) v*=.82;
  v *= clamp(1 - (p.salario/60000000),.55,1.05);
  if(p.lesao>10) v*=.7;
  return Math.round(v);
}
function zeroStats(){return {j:0,min:0,pts:0,fga:0,fgm:0,tpa:0,tpm:0,fta:0,ftm:0,reb:0,ro:0,ast:0,stl:0,blk:0,to:0,flt:0};}

/* criarLiga() definida em p2b_real.js */

function forcaTime(t){
  const e=[...t.elenco].filter(p=>!p.lesao).sort((a,b)=>b.ovr-a.ovr).slice(0,9);
  if(!e.length) return 50;
  let s=0,w=0; e.forEach((p,i)=>{const k=1/(1+i*0.42);s+=p.ovr*k;w+=k;});
  return round(s/w,1);
}
function folha(t){return t.elenco.reduce((s,p)=>s+p.salario,0);}
const TETO = 145000000;
/* ============================================================
   DADOS REAIS — NBA, temporada 2025-26
   Formato: [nome, posição, idade, overall, arquétipo]
   ============================================================ */
const TEAMS_RAW = [
 // ab, cidade, apelido, conferência, divisão, mercado(1-5), prestígio, capacidade, cor

}

function autoMinutos(t){
  const apt=[...t.elenco].filter(p=>!p.lesao).sort((a,b)=>b.ovr-a.ovr);
  const tabela=[36,34,32,30,26,22,18,15,12,8,4,3,0];
  const m={}; apt.forEach((p,i)=>m[p.id]=tabela[i]||0);
  return m;
}
function minutosDe(t){
  const m = t.minutos && Object.keys(t.minutos).length? t.minutos : autoMinutos(t);
  const out={};
  t.elenco.forEach(p=> out[p.id] = p.lesao? 0 : (m[p.id]!==undefined? m[p.id] : 0));
  const tot=Object.values(out).reduce((a,b)=>a+b,0);
  if(tot<200){ // rotação inválida -> completa automático
    const auto=autoMinutos(t); t.elenco.forEach(p=>out[p.id]=p.lesao?0:auto[p.id]||0);
  }
  return out;
}
function prepTime(t,casa){
  const alvo=minutosDe(t);
  const sorte=gauss(0,0.011);
  let aptos=t.elenco.filter(p=>!p.lesao);
  if(aptos.length<5) aptos=[...t.elenco].sort((a,b)=>a.lesao-b.lesao).slice(0,Math.max(5,aptos.length));
  const ps=aptos.map(p=>({
    ref:p, id:p.id, nome:p.nome, pos:p.pos, ovr:p.ovr, at:p.at,
    alvo: alvo[p.id]||0, seg:0, fadiga:100, faltas:0, fora:false, quadra:false,
    b:zeroBox()
  }));
  if(!ps.some(p=>p.alvo>0)) ps.forEach((p,i)=>p.alvo=i<5?38:12);
  return {t, casa, sorte, ps, pts:0, q:[0,0,0,0], faltasQ:0, quinteto:[]};
}
function zeroBox(){return {seg:0,pts:0,fga:0,fgm:0,tpa:0,tpm:0,fta:0,ftm:0,reb:0,ro:0,ast:0,stl:0,blk:0,to:0,flt:0};}

function escolherQuinteto(g){
  const cand=g.ps.filter(p=>!p.fora && p.faltas<6);
  if(cand.length<=5){g.ps.forEach(p=>p.quadra=false);cand.forEach(p=>p.quadra=true);g.quinteto=cand;return;}
  cand.forEach(p=>{
    const jog=p.seg/60, falta=p.alvo-jog;
    p._s = p.ovr*0.55 + falta*4.2 + (p.fadiga-60)*0.55 + (p.alvo>0?8:-25);
    if(p.fadiga<48) p._s-=45;
    if(p.faltas>=5) p._s-=30;
  });
  cand.sort((a,b)=>b._s-a._s);
  let cinco=cand.slice(0,5);
  const isBig=p=>p.pos==='C'||p.pos==='PF', isG=p=>p.pos==='PG'||p.pos==='SG';
  if(!cinco.some(isBig)){const b=cand.find(isBig);if(b){cinco[4]=b;}}
  if(!cinco.some(isG)){const gd=cand.find(p=>isG(p)&&!cinco.includes(p));if(gd){cinco[3]=gd;}}
  cinco=[...new Set(cinco)];
  let i=5;while(cinco.length<5&&i<cand.length){if(!cinco.includes(cand[i]))cinco.push(cand[i]);i++;}
  g.ps.forEach(p=>p.quadra=false); cinco.forEach(p=>p.quadra=true); g.quinteto=cinco;
}
const media=(arr,f)=>arr.reduce((s,p)=>s+f(p),0)/(arr.length||1);
function sorteioPeso(arr,f){
  if(!arr||!arr.length) return null;
  let tot=0;const w=arr.map(p=>{const v=Math.max(0.4,f(p));tot+=v;return v;});
  let r=Math.random()*tot;
  for(let i=0;i<arr.length;i++){r-=w[i];if(r<=0)return arr[i];}
  return arr[arr.length-1];
}

function simularJogo(tCasa,tFora,opt={}){
  const A=prepTime(tCasa,true), B=prepTime(tFora,false);
  const log=[], quer=opt.log!==false;
  const ritmoSeg=[15.8,14.2,12.6], padA=A.t.tatica, padB=B.t.tatica;
  const paceBase=(ritmoSeg[padA.ritmo]+ritmoSeg[padB.ritmo])/2;
  escolherQuinteto(A);escolherQuinteto(B);
  let quarto=0, tempo=720, posse=Math.random()<.5?A:B, ultSub=720, prot=0, lesoes=[];
  const rel=t=>{const m=Math.floor(t/60),s=Math.floor(t%60);return m+':'+(s<10?'0':'')+s;};
  const put=(txt,cls)=>{if(quer)log.push({q:quarto,t:rel(Math.max(0,tempo)),txt,cls:cls||'',pa:A.pts,pb:B.pts});};

  while(true){
    if(tempo<=0){
      if(quarto<4){A.q[quarto]=A.pts-A.q.slice(0,quarto).reduce((a,b)=>a+b,0);
                   B.q[quarto]=B.pts-B.q.slice(0,quarto).reduce((a,b)=>a+b,0);}
      else{A.q.push(A.pts-A.q.reduce((a,b)=>a+b,0));B.q.push(B.pts-B.q.reduce((a,b)=>a+b,0));}
      quarto++;
      if(quarto>=4 && A.pts!==B.pts) break;
      tempo = quarto<4?720:300; A.faltasQ=0;B.faltasQ=0;ultSub=tempo;
      escolherQuinteto(A);escolherQuinteto(B);
      put('— Fim do '+(quarto<=4?quarto+'º quarto':'PR'+(quarto-4))+' — '+A.t.ab+' '+A.pts+' x '+B.pts+' '+B.t.ab,'q');
      continue;
    }
    const D = posse===A?B:A, O=posse;
    const gastoBase = paceBase + R(-5,5.5);
    let continuar=true, tentativas=0;
    while(continuar && tentativas<4){
      continuar=false;tentativas++;
      const res = jogada(O,D,{primeira:tentativas===1,put,quarto});
      // consumo de tempo
      const gasto = tentativas===1? Math.max(3,gastoBase) : R(3,8);
      tempo-=gasto;
      // fadiga
      O.quinteto.forEach(p=>{p.seg+=gasto;p.fadiga=clamp(p.fadiga-(0.24+gasto*0.014)*(1-(p.at.res-50)/260),0,100);});
      D.quinteto.forEach(p=>{p.seg+=gasto;p.fadiga=clamp(p.fadiga-(0.22+gasto*0.013)*(1-(p.at.res-50)/260),0,100);});
      [A,B].forEach(g=>g.ps.forEach(p=>{if(!p.quadra)p.fadiga=clamp(p.fadiga+gasto*0.075,0,100);}));
      // lesões
      [A,B].forEach(g=>g.quinteto.forEach(p=>{
        if(Math.random()<0.00008*(1+(100-p.fadiga)/110)){
          const r=Math.random();const jogos = r<.68?RI(1,5): r<.92?RI(6,18):RI(20,52);
          const tipo=pick(['torção de tornozelo','estiramento','lesão no joelho','contusão','problema muscular','fascite plantar']);
          p.fora=true;p.ref._novaLesao={jogos,tipo};lesoes.push({p,jogos,tipo,time:g.t.ab});
          put('⚕ '+p.nome+' ('+g.t.ab+') sai de quadra — '+tipo+' ('+jogos+' jogos)','ev-to');
          escolherQuinteto(g);
        }
      }));
      if(res==='off'){continuar=true;}
      else if(res==='mesma'){posse=O;}
      else posse=D;
    }
    if(!continuar && tempo>0){/* posse já definida */}
    if(ultSub-tempo>=95 && tempo>6){ultSub=tempo;escolherQuinteto(A);escolherQuinteto(B);}
    prot++; if(prot>1400) break;
  }
  // encerra quartos pendentes
  const somaQ=g=>g.q.reduce((a,b)=>a+b,0);
  if(somaQ(A)<A.pts)A.q[A.q.length-1]+=A.pts-somaQ(A);
  if(somaQ(B)<B.pts)B.q[B.q.length-1]+=B.pts-somaQ(B);
  [A,B].forEach(g=>g.ps.forEach(p=>p.b.seg=p.seg));
  return {casa:tCasa,fora:tFora,A,B,ptsA:A.pts,ptsB:B.pts,log,lesoes,
          ot:Math.max(0,A.q.length-4)};
}

function jogada(O,D,ctx){
  const of=O.quinteto, df=D.quinteto;
  if(!of.length||!df.length) return 'troca';
  const tatO=O.t.tatica, tatD=D.t.tatica;
  const put=ctx.put;
  const nome=p=>p.nome.split(' ').slice(-1)[0];
  const defP=media(df,p=>p.at.defP)*(1+(tatD.pressao-1)*0.05);
  const defI=media(df,p=>p.at.defI);
  const casaBonus=(O.casa?0.015:0)+(O.sorte||0);
  // ---- posse do jogador
  const h=sorteioPeso(of,p=>Math.pow(Math.max(1,p.ovr-44),1.34)*(1+(p.at.drible-60)/300))||of[0];
  if(!h) return 'troca';
  // ---- turnover
  let pTO = 0.124 + (tatD.pressao-1)*0.022 - (h.at.qi-65)*0.0009 - (h.at.drible-65)*0.0008 + (100-h.fadiga)*0.0004;
  pTO=clamp(pTO,.055,.21);
  if(Math.random()<pTO){
    h.b.to++;
    if(Math.random()<.6){const s=sorteioPeso(df,p=>p.at.defP+p.at.atl*0.4);s.b.stl++;
      put(nome(h)+' perde a bola — roubada de '+nome(s),'ev-to');}
    else put('Turnover de '+nome(h)+' ('+O.t.ab+')','ev-to');
    return 'troca';
  }
  // ---- falta não-arremesso
  if(Math.random()<0.072+(tatD.pressao-1)*0.020){
    const f=sorteioPeso(df,p=>60+ (100-p.at.qi)*0.5); f.b.flt++;f.faltas++;
    D.faltasQ++;
    if(f.faltas>=6){f.fora=true;put('🚫 '+nome(f)+' ('+D.t.ab+') eliminado por faltas','ev-to');escolherQuinteto(D);}
    if(D.faltasQ>4){ // bônus: 2 lances
      lances(O,h,2,put,nome); return finalLance(O,D,h,put,nome);
    }
    return 'mesma';
  }
  // ---- escolha do arremesso
  const foco=tatO.foco; // 0 dentro, 1 equilíbrio, 2 perímetro
  const w3  = Math.max(.05, 1.02+(h.at.arr3-56)*0.058 + (foco-1)*0.50);
  const wRim= Math.max(.10, 1.45+(h.at.fin-62)*0.045+(h.at.atl-66)*0.020 - (foco-1)*0.32);
  const wMid= Math.max(.15, 0.85-(h.at.arr3-56)*0.012);
  const r=Math.random()*(w3+wRim+wMid);
  const tipo = r<w3?3 : r<w3+wMid?2 : 1; // 3=triple 2=media 1=garrafão
  const fad=(h.fadiga-82)*0.0009, form=(h.ref.forma-95)*0.0009+(h.ref.moral-70)*0.0004;
  let prob, pFalta;
  if(tipo===3){ prob=.354+(h.at.arr3-70)*.0029-(defP-68)*.0020+casaBonus+fad+form; prob=clamp(prob,.16,.53); pFalta=.028; }
  else if(tipo===2){ prob=.428+(h.at.arr2-70)*.0029-(defP-68)*.0019+casaBonus+fad+form; prob=clamp(prob,.26,.58); pFalta=.05; }
  else { prob=.604+(h.at.fin-70)*.0032-(defI-68)*.0024+casaBonus+fad+form; prob=clamp(prob,.38,.78); pFalta=.195; }
  pFalta*=(1+(tatD.pressao-1)*0.14);
  // ---- toco
  if(tipo!==3 && Math.random()< (tipo===1?.055:.022)+(defI-68)*.0016){
    h.b.fga++; if(tipo===3)h.b.tpa++;
    const bl=sorteioPeso(df,p=>p.at.defI+p.at.atl*0.6); bl.b.blk++;
    put('TOCO! '+nome(bl)+' bloqueia '+nome(h),'hi');
    return rebote(O,D,put,nome);
  }
  const acertou=Math.random()<prob;
  const falta=Math.random()<pFalta;
  h.b.fga++; if(tipo===3)h.b.tpa++;
  if(acertou){
    const v=tipo===3?3:2; h.b.fgm++; if(tipo===3)h.b.tpm++; h.b.pts+=v; O.pts+=v;
    // assistência
    const cand=of.filter(p=>p!==h);
    const pAst=(tipo===3?.78:tipo===2?.44:.47)*clamp(media(of,p=>p.at.passe)/66,.7,1.3);
    let ast=null;
    if(cand.length&&Math.random()<pAst){ast=sorteioPeso(cand,p=>p.at.passe+p.at.qi*0.35);ast.b.ast++;}
    const desc = tipo===3?'BOLA DE 3 de '+nome(h):tipo===2?'jumper de '+nome(h):'cesta de '+nome(h)+' no garrafão';
    put(desc+(ast?' (assist. '+nome(ast)+')':'')+' — '+O.t.ab+' '+O.pts,tipo===3?'ev-3':'');
    if(falta){
      const f=sorteioPeso(df,p=>60);f.b.flt++;f.faltas++;D.faltasQ++;
      if(f.faltas>=6){f.fora=true;escolherQuinteto(D);}
      put('E a falta! Lance livre adicional para '+nome(h),'hi');
      lances(O,h,1,put,nome);
      return h.b._ultReal?'troca':rebote(O,D,put,nome,true);
    }
    return 'troca';
  }
  // errou
  if(falta){
    const f=sorteioPeso(df,p=>60);f.b.flt++;f.faltas++;D.faltasQ++;
    if(f.faltas>=6){f.fora=true;put('🚫 '+nome(f)+' eliminado por faltas','ev-to');escolherQuinteto(D);}
    const n=tipo===3?3:2;
    put('Falta em '+nome(h)+' — '+n+' lances livres');
    lances(O,h,n,put,nome);
    return finalLance(O,D,h,put,nome);
  }
  return rebote(O,D,put,nome);
}
function lances(O,h,n,put,nome){
  const p=clamp(.72+(h.at.ll-70)*.0058,.42,.95);
  let feitos=0;
  for(let i=0;i<n;i++){h.b.fta++;if(Math.random()<p){h.b.ftm++;h.b.pts++;O.pts++;feitos++;}}
  h.b._ultReal = feitos===n;
  put(nome(h)+' nos lances: '+feitos+'/'+n+' — '+O.t.ab+' '+O.pts);
}
function finalLance(O,D,h,put,nome){
  if(h.b._ultReal) return 'troca';
  return rebote(O,D,put,nome,true);
}
function rebote(O,D,put,nome,silencioso){
  const rebO=media(O.quinteto,p=>p.at.reb), rebD=media(D.quinteto,p=>p.at.reb);
  const pOff=clamp(.265+(rebO-rebD)*.0028,.14,.42);
  if(Math.random()<pOff){
    const r=sorteioPeso(O.quinteto,p=>p.at.reb*1.4+p.at.atl*0.5);
    if(r){r.b.reb++;r.b.ro++;if(!silencioso)put('Rebote ofensivo de '+nome(r));}
    return 'off';
  }
  const r=sorteioPeso(D.quinteto,p=>p.at.reb*1.5+p.at.atl*0.4);
  if(r)r.b.reb++;
  return 'troca';
}

/* ---------- consolidação ---------- */
function gravarJogo(res){
  [res.A,res.B].forEach(g=>{
    g.ps.forEach(p=>{
      if(p.b.seg<=0 && p.b.fga===0 && p.b.pts===0 && p.seg<=0)return;
      const s=p.ref.stats, b=p.b;
      s.j++;s.min+=p.seg/60;
      ['pts','fga','fgm','tpa','tpm','fta','ftm','reb','ro','ast','stl','blk','to','flt'].forEach(k=>s[k]+=b[k]);
      p.ref.forma=clamp(p.ref.forma-R(1.5,5)+ (p.seg<600?3:0),55,100);
      if(p.ref._novaLesao){p.ref.lesao=p.ref._novaLesao.jogos;p.ref.lesaoTxt=p.ref._novaLesao.tipo;delete p.ref._novaLesao;}
    });
  });
  const A=res.A,B=res.B,vA=res.ptsA>res.ptsB;
  A.t.v+=vA?1:0;A.t.d+=vA?0:1;B.t.v+=vA?0:1;B.t.d+=vA?1:0;
  A.t.pf+=res.ptsA;A.t.pc+=res.ptsB;B.t.pf+=res.ptsB;B.t.pc+=res.ptsA;
  A.t.seq.unshift(vA?'V':'D');B.t.seq.unshift(vA?'D':'V');
  A.t.seq=A.t.seq.slice(0,8);B.t.seq=B.t.seq.slice(0,8);
}
function boxOrdenado(g){return g.ps.filter(p=>p.seg>0).sort((a,b)=>b.seg-a.seg);}
function totaisBox(g){const t=zeroBox();g.ps.forEach(p=>{for(const k in t)t[k]+=p.b[k]||0;});return t;}
/* ============================================================
   LIGA — calendário, temporada, finanças, playoffs, offseason
   ============================================================ */
const JOGOS_TEMP = 82;
/* Calendário estilo NBA: 82 jogos por time.
   Mais confrontos dentro da conferência, menos entre conferências. */
function gerarCalendario(times){
  times=times||S.times;
  const pares=[]; // lista de confrontos {c,f}
  const conf=id=>times[id].conf;
  const div=id=>times[id].div;
  // define quantas vezes A joga contra B (ida+volta somados aproximando a NBA)
  for(let a=0;a<30;a++)for(let b=a+1;b<30;b++){
    let n;
    if(conf(a)!==conf(b)) n=2;                    // interconferência: 2 jogos
    else if(div(a)===div(b)) n=4;                  // mesma divisão: 4 jogos
    else n=3+ (((a+b)%2)?1:0);                     // mesma conf, outra div: 3-4
    for(let k=0;k<n;k++){
      // alterna mando
      if(k%2===0) pares.push({c:a,f:b,res:null});
      else pares.push({c:b,f:a,res:null});
    }
  }
  // ajusta cada time para ~82 jogos
  const conta=()=>{const cc={};times.forEach((t,i)=>cc[i]=0);pares.forEach(p=>{if(p){cc[p.c]++;cc[p.f]++;}});return cc;};
  // embaralha
  for(let i=pares.length-1;i>0;i--){const j=RI(0,i);[pares[i],pares[j]]=[pares[j],pares[i]];}
  // remove excedentes acima de 82 (só quando ambos os times estão acima)
  let c=conta();
  for(let i=0;i<pares.length;i++){
    const p=pares[i];
    if(c[p.c]>82 && c[p.f]>82){c[p.c]--;c[p.f]--;pares[i]=null;}
  }
  let filtrado=pares.filter(Boolean);
  // completa quem ficou abaixo de 82 com confrontos extras equilibrados
  const recont=()=>{const cc={};times.forEach((t,i)=>cc[i]=0);filtrado.forEach(p=>{cc[p.c]++;cc[p.f]++;});return cc;};
  c=recont();
  let faltam=Object.entries(c).filter(([i,v])=>v<82).map(([i])=>+i);
  let tent=0;
  while(faltam.length>=2 && tent++<600){
    const a=faltam[RI(0,faltam.length-1)];
    let b=faltam.find(x=>x!==a && times[x].conf===times[a].conf);
    if(b==null) b=faltam.find(x=>x!==a);
    if(b==null) break;
    filtrado.push({c:Math.random()<.5?a:b, f:Math.random()<.5?b:a, res:null});
    const last=filtrado[filtrado.length-1];
    if(last.c===last.f) last.f=(a===last.c?b:a);
    c=recont();faltam=Object.entries(c).filter(([i,v])=>v<82).map(([i])=>+i);
  }
  // distribui em rodadas: cada rodada, cada time joga no máx 1x
  const rodadas=[];
  let resto=[...filtrado];
  while(resto.length){
    const usados=new Set(); const rod=[]; const sobra=[];
    for(const p of resto){
      if(!usados.has(p.c)&&!usados.has(p.f)){usados.add(p.c);usados.add(p.f);rod.push(p);}
      else sobra.push(p);
    }
    rodadas.push(rod); resto=sobra;
  }
  return rodadas;
}
const pctV=t=>t.v+t.d>0? t.v/(t.v+t.d):0;
function classificacao(conf){
  return S.times.filter(t=>!conf||t.conf===conf)
    .sort((a,b)=> pctV(b)-pctV(a) || (b.pf-b.pc)-(a.pf-a.pc) || b.pf-a.pf);
}
function proximoJogo(){
  for(let r=S.rodada;r<S.cal.length;r++)
    for(const j of S.cal[r]) if(j.c===S.meuTime||j.f===S.meuTime) return {rodada:r,j};
  return null;
}
function noticia(txt,tipo){S.noticias.unshift({txt,tipo:tipo||'',r:S.rodada});S.noticias=S.noticias.slice(0,60);}

/* ---------- FINANÇAS ---------- */
function ocupacao(t){
  return clamp(.52 + (t.prestigio-70)*.009 + (pctV(t)-.5)*.5 - (t.ingresso-95)/420, .30, 1);
}
function financasRodada(rod){
  S.times.forEach(t=>{
    t.caixa -= folha(t)/JOGOS_TEMP;
    t.caixa += (t.patroc + (t.tv||60e6))/JOGOS_TEMP;
  });
  rod.forEach(j=>{
    const t=S.times[j.c], oc=ocupacao(t), pub=Math.round(t.capacidade*oc);
    const rec = pub*t.ingresso + pub*13; // ingresso + consumo
    t.caixa += rec;
    if(j.c===S.meuTime||j.f===S.meuTime) S.ultPublico={pub,rec,oc};
  });
}

/* ---------- TEMPORADA ---------- */
function avancarRodada(){
  if(S.fase!=='regular') return null;
  let meuRes=null;
  // processa rodadas até encontrar (e jogar) uma em que o SEU time joga,
  // pulando em silêncio as rodadas em que seu time folga — assim nunca "trava"
  let seguranca=0;
  while(S.fase==='regular' && S.rodada<S.cal.length && seguranca++<90){
    const rod=S.cal[S.rodada];
    const meuJoga = rod.some(j=>j.c===S.meuTime||j.f===S.meuTime);
    rod.forEach(j=>{
      const A=S.times[j.c],B=S.times[j.f];
      const meu = j.c===S.meuTime||j.f===S.meuTime;
      const res=simularJogo(A,B,{log:meu});
      gravarJogo(res);
      j.res=[res.ptsA,res.ptsB];
      if(meu){meuRes=res;S.ultimoJogo=serializarJogo(res);}
    });
    financasRodada(rod);
    S.times.forEach(t=>t.elenco.forEach(p=>{
      if(p.lesao>0){p.lesao--;if(p.lesao===0){p.lesaoTxt='';p.forma=clamp(p.forma-8,50,100);}}
      p.forma=clamp(p.forma+R(1,4),0,100);
    }));
    atualizarMoral();
    if(typeof atualizarOlheiro==='function')atualizarOlheiro();
    if(typeof gerarPropostasIA==='function'){gerarPropostasIA();expirarPropostas();}
    S.rodada++;
    if(meuRes){
      const meuA = meuRes.A.t.id===S.meuTime;
      const eu=meuA?meuRes.ptsA:meuRes.ptsB, ele=meuA?meuRes.ptsB:meuRes.ptsA;
      const adv=meuA?meuRes.B.t:meuRes.A.t;
      noticia((eu>ele?'✅ Vitória':'❌ Derrota')+' '+eu+'x'+ele+' contra '+adv.cidade+' '+adv.nick,eu>ele?'v':'d');
      meuRes.lesoes.filter(l=>l.time===S.times[S.meuTime].ab).forEach(l=>
        noticia('⚕ '+l.p.nome+' desfalca o time por '+l.jogos+' jogos ('+l.tipo+')','x'));
    }
    if(S.rodada>=S.cal.length){ iniciarPlayoffs(); break; }
    if(meuJoga) break; // jogou o seu jogo desta vez: para aqui
  }
  return meuRes;
}
function atualizarMoral(){
  S.times.forEach(t=>{
    const v=t.seq.filter(x=>x==='V').length, base=(v-t.seq.length/2)*3;
    t.elenco.forEach(p=>{
      const mn=(t.minutos&&t.minutos[p.id])!==undefined?t.minutos[p.id]:24;
      const esperado = p.ovr>=78?32:p.ovr>=70?26:p.ovr>=62?18:10;
      p.moral=clamp(p.moral+base*0.25+(mn-esperado)*0.18+R(-1,1),5,100);
    });
  });
}
function serializarJogo(res){
  const mk=g=>({ab:g.t.ab,nome:g.t.cidade+' '+g.t.nick,pts:g.pts,q:g.q,
    box:boxOrdenado(g).map(p=>({nome:p.nome,pos:p.pos,...p.b,min:p.seg/60})),
    tot:totaisBox(g)});
  return {A:mk(res.A),B:mk(res.B),log:res.log,ot:res.ot};
}

function iniciarPlayIn(){
  S.fase='playin';
  if(typeof apurarPremios==='function') apurarPremios();

  const mk=conf=>classificacao(conf);

  // seeds 1-6 já classificados; 7-10 disputam
  const bloco=(arr,conf)=>({
    conf, top6:arr.slice(0,6).map(t=>t.id),
    // Jogo 7x8 (vencedor = 7º seed), Jogo 9x10 (perdedor eliminado),
    // vencedor(9x10) x perdedor(7x8) = 8º seed
    j78:{a:arr[6].id,b:arr[7].id,res:null},
    j910:{a:arr[8].id,b:arr[9].id,res:null},
    jfinal:null, seed7:null, seed8:null, etapa:0

  S.playin={L:bloco(L,'L'),O:bloco(O,'O')};

function jogarPlayIn(){
  let meuRes=null;
  ['L','O'].forEach(cf=>{
    const b=S.playin[cf];
    if(b.etapa===0){ // rodada 1: 7x8 e 9x10
      [b.j78,b.j910].forEach(j=>{
        const A=S.times[j.a],B=S.times[j.b];
        const meu=[j.a,j.b].includes(S.meuTime);
        const res=simularJogo(A,B,{log:meu});gravarJogo(res);
        j.res=[res.ptsA,res.ptsB];j.venc=res.ptsA>res.ptsB?j.a:j.b;j.perd=res.ptsA>res.ptsB?j.b:j.a;
        if(meu){meuRes=res;S.ultimoJogo=serializarJogo(res);}
      });
      b.seed7=b.j78.venc;
      const perd78=S.times[b.j78.perd], perd910=S.times[b.j910.perd];
      perd910.hist[perd910.hist.length-1].fase='Play-In (10º)';
      b.jfinal={a:b.j78.perd,b:b.j910.venc,res:null};
      b.etapa=1;
    } else if(b.etapa===1){ // final do play-in: perdedor(7x8) x vencedor(9x10)
      const j=b.jfinal;const A=S.times[j.a],B=S.times[j.b];
      const meu=[j.a,j.b].includes(S.meuTime);
      const res=simularJogo(A,B,{log:meu});gravarJogo(res);
      j.res=[res.ptsA,res.ptsB];j.venc=res.ptsA>res.ptsB?j.a:j.b;j.perd=res.ptsA>res.ptsB?j.b:j.a;
      if(meu){meuRes=res;S.ultimoJogo=serializarJogo(res);}
      b.seed8=j.venc;
      const elim=S.times[j.perd];elim.hist[elim.hist.length-1].fase='Play-In (9º)';
      b.etapa=2;
    }
  });
  S.times.forEach(t=>t.elenco.forEach(p=>{if(p.lesao>0)p.lesao--;p.forma=clamp(p.forma+R(1,4),0,100);}));
  const meuElim = S.meuTime!=null && ['L','O'].some(cf=>{const b=S.playin[cf];
    return b.etapa>=1 && b.j910.perd===S.meuTime || (b.etapa>=2 && b.jfinal.perd===S.meuTime);});
  if(S.playin.L.etapa>=2 && S.playin.O.etapa>=2){
    // define seeds e vai pros playoffs
    montarPlayoffsComPlayIn();
  }
  return meuRes;
}
function montarPlayoffsComPlayIn(){
  const seedsDe=cf=>{

  };
  const L=seedsDe('L'),O=seedsDe('O');
  const par=(arr)=>[[0,7],[3,4],[2,5],[1,6]].map(([i,k])=>novaSerie(arr[i],arr[k],i+1,k+1));
  S.po={fase:0,series:[...par(L),...par(O)],campeao:null};

}

function novaSerie(a,b,sa,sb){return {a:a.id,b:b.id,sa,sb,va:0,vb:0,jogos:[],fim:false,conf:a.conf};}
function jogarRodadaPO(){

}

/* ---------- OFFSEASON ---------- */
function processarOffseason(){
  const rel=[];
  S.livres=S.livres||[];
  S.times.forEach(t=>{
    const sai=[];
    t.elenco.forEach(p=>{
      p.idade++;
      // desenvolvimento
      let d;
      if(p.idade<=22) d=RI(-1,5)+(p.pot-p.ovr>8?2:0);
      else if(p.idade<=25) d=RI(-1,4);
      else if(p.idade<=28) d=RI(-2,2);
      else if(p.idade<=31) d=RI(-3,1);
      else if(p.idade<=34) d=RI(-5,0);
      else d=RI(-8,-1);
      const alvo=clamp(p.ovr+d,25,p.pot);
      const dif=alvo-p.ovr;
      if(dif!==0){
        const ks=Object.keys(p.at);
        for(let i=0;i<Math.abs(dif)*2;i++){const k=pick(ks);p.at[k]=clamp(p.at[k]+(dif>0?RI(1,3):-RI(1,3)),20,99);}
        p.ovr=calcOvr(p);
      }
      p.carreira && ['j','min','pts','fga','fgm','tpa','tpm','fta','ftm','reb','ro','ast','stl','blk','to','flt']
        .forEach(k=>p.carreira[k]+=p.stats[k]);
      p.ovrPico = Math.max(p.ovrPico||0, p.ovr); // guarda o auge da carreira
      p.stats=zeroStats();p.lesao=0;p.lesaoTxt='';p.forma=RI(90,100);
      p.anos--;
      if(p.idade>=36 && Math.random()<.45+(p.idade-36)*.18 || p.ovr<44&&p.idade>=33){
        p.aposentou=true;sai.push(p);rel.push(p.nome+' ('+t.ab+') anunciou aposentadoria aos '+p.idade);
        if(typeof aposentarCamisa==='function') aposentarCamisa(p, t.ab); // lendas têm a camisa aposentada
      } else if(p.anos<=0){ p.salario=valorSalarial(p); sai.push(p); p.time=null; S.livres.push(p); }
    });
    t.elenco=t.elenco.filter(p=>!sai.includes(p));
    t.v=0;t.d=0;t.pf=0;t.pc=0;t.seq=[];
    t.caixa += t.patroc*0.15;
    t.patroc = Math.round((12+t.mercado*5+ (t.prestigio-70)*0.35)*1e6*R(.9,1.15));
    t.tv = Math.round((30+t.mercado*3.5)*1e6*R(.98,1.06));
    t.prestigio = clamp(Math.round(t.prestigio*0.82 + forcaTime(t)*0.18 + (t.camp?2:0)),40,95);
  });
  S.livres=S.livres.filter(p=>!p.aposentou);
  // classe de novatos
  S.draft = [];
  for(let i=0;i<30;i++){
    const p=novoJogador(null, R(-14,8), 19,22);
    p.pot=clamp(p.ovr+RI(6,26),p.ovr,99);p.anos=3;p.salario=valorSalarial(p)*0.6;
    p.novato=true;S.draft.push(p);
  }
  S.draft.sort((a,b)=>(b.ovr+b.pot*0.7)-(a.ovr+a.pot*0.7));
  // easter eggs: injeta os 3 prospectos especiais no PRIMEIRO draft
  if(typeof injetarEggsNoDraft==='function') injetarEggsNoDraft();
  // ordem do draft: pior time escolhe 1º; MAS quem POSSUI o pick daquele slot escolhe
  const ordemTimes = classificacao().slice().reverse().map(t=>t.id); // pior->melhor
  // pega os picks de 1ª rodada do ano atual, na ordem dos slots
  const picks1 = ordemTimes.map(donoId=>{
    const pk=(S.picks||[]).find(p=>p.ano===S.temporada && p.rodada===1 && p.dono===donoId);
    return pk ? {via:pk.via, dono:donoId, pk} : {via:donoId, dono:donoId, pk:null};
  });
  S.ordemDraft = picks1.map(x=>x.via);     // quem realmente escolhe em cada slot
  S.ordemDonos = picks1.map(x=>x.dono);    // de quem era o slot (pra exibir)
  // consome os picks de 1ª rodada usados neste draft
  S.picks=(S.picks||[]).filter(p=>!(p.ano===S.temporada && p.rodada===1));
  // gera nova leva de picks 4 anos à frente
  S.times.forEach(t=>{
    S.picks.push({id:'P'+(PICKID++), ano:S.temporada+4, dono:t.id, via:t.id, rodada:1});
    S.picks.push({id:'P'+(PICKID++), ano:S.temporada+4, dono:t.id, via:t.id, rodada:2});
  });
  // remove picks de 2ª rodada já vencidos
  S.picks=S.picks.filter(p=>p.ano>=S.temporada);
  S.temporada++;
  S.fase='draft';
  noticia('📋 Temporada '+S.temporada+' — Draft de novatos disponível','p');
  return rel;
}
function executarDraft(escolhaUsuario){

  while(S.draftPick<S.ordemDraft.length){
    const tid=S.ordemDraft[S.draftPick];
    if(tid===S.meuTime && escolhaUsuario===undefined) return false; // espera escolha
    let p;
    if(tid===S.meuTime){p=escolhaUsuario;escolhaUsuario=undefined;}
    else{
      const top=S.draft.slice(0,4);
      p=sorteioPeso(top,x=>x.ovr+x.pot*0.6);

}
function faseAgentesLivres(){

function contratarLivre(p){
  const t=S.times[S.meuTime];
  if(t.elenco.length>=15) return 'Elenco cheio (máx. 15).';
  if(folha(t)+p.salario>TETO && S.fase==='regular') return 'Estoura o teto salarial de '+$(TETO)+'.';
  if(t.caixa<p.salario*0.4) return 'Caixa insuficiente.';
  S.livres=S.livres.filter(x=>x!==p);
  p.time=t.id;p.anos=RI(2,4);t.elenco.push(p);t.elenco.sort((a,b)=>b.ovr-a.ovr);
  noticia('✍ Contratado: '+p.nome+' ('+p.pos+' '+p.ovr+') por '+$(p.salario)+'/ano','v');
  return null;
}
function dispensar(p){
  const t=S.times[S.meuTime];
  if(t.elenco.length<=9) return 'Você precisa de pelo menos 9 jogadores.';
  t.elenco=t.elenco.filter(x=>x!==p);
  t.caixa-=p.salario*0.35;
  p.time=null;S.livres.push(p);
  noticia('🚪 '+p.nome+' foi dispensado (multa de '+$(p.salario*0.35)+')','x');
  return null;
}
function avaliarTroca(meus,deles,outroId,meusPicks,delesPicks){
  meusPicks=meusPicks||[]; delesPicks=delesPicks||[];
  const outro=S.times[outroId], meu=S.times[S.meuTime];
  const vIn=meus.reduce((s,p)=>s+valorMercado(p),0) + meusPicks.reduce((s,pk)=>s+valorPick(pk),0);
  const vOut=deles.reduce((s,p)=>s+valorMercado(p),0) + delesPicks.reduce((s,pk)=>s+valorPick(pk),0);
  const salIn=meus.reduce((s,p)=>s+p.salario,0), salOut=deles.reduce((s,p)=>s+p.salario,0);
  const novoElenco=outro.elenco.length-deles.length+meus.length;
  if(novoElenco<9) return {ok:false,msg:'O outro time ficaria com elenco pequeno demais.'};
  if(novoElenco>15) return {ok:false,msg:'O outro time ficaria com elenco cheio demais.'};
  if(meu.elenco.length-meus.length+deles.length>15) return {ok:false,msg:'Seu elenco passaria de 15 jogadores.'};
  if(meu.elenco.length-meus.length+deles.length<9) return {ok:false,msg:'Seu elenco ficaria abaixo de 9 jogadores.'};
  const folhaNova=folha(outro)-salOut+salIn;
  if(folhaNova>TETO*1.12 && salIn>salOut) return {ok:false,msg:'Eles não têm espaço salarial para isso.'};
  let exig = 1.08 + (outro.prestigio>80?0.08:0);
  // a IA topa mais fácil quando você entrega VÁRIAS peças por 1 estrela (facilita consolidar)
  if(meus.length+meusPicks.length>=3 && deles.length===1) exig -= 0.06;
  if(vIn>=vOut*exig) return {ok:true,msg:'Proposta aceita!'};
  const falta=Math.round((vOut*exig-vIn)/Math.max(1,vOut*exig)*100);
  return {ok:false,msg:'Recusada. Eles querem cerca de '+falta+'% a mais de valor.'};
}
function executarTroca(meus,deles,outroId,meusPicks,delesPicks){
  meusPicks=meusPicks||[]; delesPicks=delesPicks||[];
  const outro=S.times[outroId],meu=S.times[S.meuTime];
  meu.elenco=meu.elenco.filter(p=>!meus.includes(p));
  outro.elenco=outro.elenco.filter(p=>!deles.includes(p));
  meus.forEach(p=>{p.time=outro.id;outro.elenco.push(p);});
  deles.forEach(p=>{p.time=meu.id;meu.elenco.push(p);});
  // transfere picks
  meusPicks.forEach(pk=>{pk.via=outro.id;});
  delesPicks.forEach(pk=>{pk.via=meu.id;});
  [meu,outro].forEach(t=>{t.elenco.sort((a,b)=>b.ovr-a.ovr);t.minutos=autoMinutos(t);});
  const desc=[];
  if(meus.length)desc.push('saíram '+meus.map(p=>p.nome.split(' ').pop()).join(', '));
  if(meusPicks.length)desc.push('+ '+meusPicks.length+' pick(s)');
  if(deles.length)desc.push('chegaram '+deles.map(p=>p.nome.split(' ').pop()).join(', '));
  if(delesPicks.length)desc.push('+ '+delesPicks.length+' pick(s)');
  noticia('🔄 Troca com '+outro.cidade+': '+desc.join(' / '),'p');
}

// Cada pick: {ano, dono(timeId original), via(timeId que possui agora), rodada:1|2, protegido}
function inicializarPicks(){
  // cada time começa com seus próprios picks de 1ª e 2ª rodada dos próximos 4 anos
  S.picks=[];
  for(let ano=S.temporada; ano<S.temporada+4; ano++){
    S.times.forEach(t=>{
      S.picks.push({id:'P'+(PICKID++), ano, dono:t.id, via:t.id, rodada:1});
      S.picks.push({id:'P'+(PICKID++), ano, dono:t.id, via:t.id, rodada:2});
    });
  }
}
var PICKID=1;
function picksDe(timeId){ return (S.picks||[]).filter(p=>p.via===timeId); }
// estima onde o pick vai cair pela força atual do time-dono (melhor time = pick mais tardio)
function posicaoEstimada(pick){
  const dono=S.times[pick.dono];
  const rank=[...S.times].sort((a,b)=>forcaTime(b)-forcaTime(a)).findIndex(t=>t.id===dono.id); // 0=melhor
  return rank+1; // 1..30 (aprox. posição no draft = inverso da força)
  // obs: no draft real o pior escolhe 1º; aqui rank 0 (melhor) => escolhe por último (pos 30)
}
function posDraftReal(pick){
  // pior time escolhe 1º. rank 0 = melhor => posição 30
  return 31 - posicaoEstimada(pick);
}
function valorPick(pick){
  const anosFuturo = pick.ano - S.temporada; // 0 = próximo
  const pos = posDraftReal(pick); // 1 (top) .. 30
  // curva de valor por posição (top picks valem muito mais)
  let base;
  if(pick.rodada===1){
    base = 240000 * Math.pow((31-pos)/30, 2.1) + 22000; // pos1 ~262k, pos30 ~24k
  } else {
    base = 40000 * Math.pow((31-pos)/30, 1.6) + 6000;   // 2ª rodada bem menor
  }
  // incerteza do futuro reduz um pouco o valor
  base *= Math.pow(0.9, anosFuturo);
  // picks muito no futuro têm posição incerta -> puxa pra média
  return Math.round(base);
}
function nomePick(pick){
  const dono=S.times[pick.dono];
  const via = pick.via!==pick.dono ? '' : '';
  const r = pick.rodada===1?'1ª':'2ª';
  const pos = posDraftReal(pick);
  const proj = pick.ano===S.temporada ? ' (~#'+pos+')' : '';
  return `Pick ${r} rod. ${pick.ano}${proj} · ${dono.ab}`;
}

function initCarreira(){
  if(!S.carreiraTec){
    S.carreiraTec={
      historico:[],          // uma entrada por temporada dirigida
      reputacao:50,          // 0-100, cresce com sucesso
      titulos:0, playoffs:0, temporadas:0,
      vitorias:0, derrotas:0,
      timesDirigidos:[],     // ids/nomes por onde passou
      ofertas:[],            // propostas de emprego disponíveis
      desempregado:false
    };
  }
}
// registra o encerramento de uma temporada no currículo do técnico
function registrarTemporadaCarreira(){
  initCarreira();
  const t=S.times[S.meuTime];
  const c=S.carreiraTec;
  const foiPO = S.po && S.po.series.some(s=>[s.a,s.b].includes(S.meuTime));
  const foiCampeao = S.po && S.po.campeao===S.meuTime;
  // resultado no playoff, se houve
  let resultado='Não classificou';
  if(foiCampeao) resultado='🏆 Campeão';
  else if(foiPO){
    const h=t.hist[t.hist.length-1];
    resultado = h&&h.fase&&h.fase!=='—'? h.fase : 'Playoffs';
  } else {
    // checar play-in
    resultado = pctV(t)>=0.5? 'Fora dos playoffs' : 'Temporada de reconstrução';
  }
  const entrada={
    temp:S.temporada, time:t.ab, timeNome:t.cidade+' '+t.nick,
    v:t.v, d:t.d, aproveitamento:Math.round(pctV(t)*100),
    resultado, objetivo:S.objetivo.txt, cumpriu: cumpriuObjetivo(),
    forca:forcaTime(t)
  };
  c.historico.push(entrada);
  c.temporadas++;
  c.vitorias+=t.v; c.derrotas+=t.d;
  if(foiPO)c.playoffs++;
  if(foiCampeao)c.titulos++;
  if(!c.timesDirigidos.includes(t.ab))c.timesDirigidos.push(t.ab);
  // atualiza reputação
  let dRep=0;
  if(foiCampeao)dRep=18; else if(foiPO)dRep=8; else if(pctV(t)>=0.5)dRep=2; else dRep=-6;
  if(entrada.cumpriu)dRep+=4; else dRep-=4;
  c.reputacao=clamp(c.reputacao+dRep, 5, 99);
  return entrada;
}
function cumpriuObjetivo(){
  const t=S.times[S.meuTime];const n=S.objetivo.nivel;
  const foiPO = S.po && S.po.series.some(s=>[s.a,s.b].includes(S.meuTime));
  const foiCampeao = S.po && S.po.campeao===S.meuTime;
  if(n>=3) return foiPO && (S.po.campeao===S.meuTime || t.hist[t.hist.length-1].fase&&/Final|Campe/.test(t.hist[t.hist.length-1].fase));
  if(n>=2) return foiPO;
  if(n===1) return pctV(t)>=0.40;
  return t.caixa>-20e6;
}

function avaliarEmprego(){

/* ---------- ofertas de emprego ---------- */
function gerarOfertasEmprego(){
  initCarreira();
  const c=S.carreiraTec;
  const rep=c.reputacao;
  // times candidatos a contratar: os que não são potências (janela pra um técnico recém-demitido),
  // ponderado pela reputação — reputação alta abre portas em times melhores
  const cand=S.times.map(t=>{
    if(t.id===S.meuTime) return null; // o time que te demitiu não te recontrata
    const forca=forcaTime(t);
    // atratividade da vaga do ponto de vista do time: quão provável de te chamar
    // times fracos chamam qualquer um; times bons só chamam reputação alta
    const exigido = clamp((forca-72)*4 + 30, 20, 92);
    const chance = clamp(rep - exigido + 45, 0, 100);
    return {t, forca, exigido, chance};
  }).filter(x=>x && x.chance>15);
  // sorteia 2-4 ofertas
  cand.sort((a,b)=>b.chance-a.chance);
  const pool=cand.slice(0, Math.min(10,cand.length));
  const nOfertas=clamp(2+Math.floor(rep/30), 2, 4);
  const escolhidos=[];
  const usados=new Set();
  let tent=0;
  while(escolhidos.length<nOfertas && tent++<50 && pool.length){
    const pick=sorteioPeso(pool, x=>x.chance);
    if(!pick||usados.has(pick.t.id))continue;
    usados.add(pick.t.id);
    const t=pick.t;
    // define objetivo/expectativa e "paciência" da diretoria
    const rank=[...S.times].sort((a,b)=>forcaTime(b)-forcaTime(a)).findIndex(x=>x.id===t.id)+1;
    let expectativa, nivel;
    if(rank<=6){expectativa='Brigar pelo título';nivel=3;}
    else if(rank<=14){expectativa='Chegar aos playoffs';nivel=2;}
    else if(rank<=22){expectativa='Lutar pelo play-in';nivel=1;}
    else {expectativa='Reconstruir o elenco';nivel=0;}
    escolhidos.push({
      timeId:t.id, ab:t.ab, nome:t.cidade+' '+t.nick, forca:forcaTime(t),
      rank, expectativa, nivel, prestigio:t.prestigio,
      salario: Math.round((3+ (30-rank)*0.25 + rep/20)*1e6) // salário do técnico (cosmético/financeiro)
    });
  }
  c.ofertas=escolhidos;
  if(escolhidos.length)noticia('📇 Você recebeu '+escolhidos.length+' proposta(s) para dirigir na próxima temporada.','p');
  return escolhidos;
}
function aceitarOferta(timeId){

/* ============================================================
   PROPOSTAS DE TROCA VINDAS DA IA
   ============================================================ */
function gerarPropostasIA(){
  // outros times ocasionalmente oferecem trocas ao usuário
  if(!S.propostas)S.propostas=[];
  // limita a 4 propostas ativas; chance por rodada
  if(S.propostas.length>=4) return;
  if(Math.random()>0.22) return; // ~22% de chance por rodada de surgir proposta
  const meu=S.times[S.meuTime];
  // um time aleatório com necessidade tenta pegar um jogador seu
  const outro=pick(S.times.filter(t=>t.id!==S.meuTime));
  const necOutro=necessidadesTime(outro);
  // alvo: um jogador MEU que cobre a necessidade do outro time
  const posAlvo=Object.entries(necOutro).sort((a,b)=>b[1]-a[1])[0];
  if(!posAlvo||posAlvo[1]<25) return;
  const candidatos=meu.elenco.filter(p=>p.pos===posAlvo[0] && p.ovr>=68).sort((a,b)=>b.ovr-a.ovr);
  const desejado=candidatos[0];
  if(!desejado) return;
  // o outro time oferece jogadores + picks de valor compatível
  const valAlvo=valorMercado(desejado);
  const oferta=montarOfertaIA(outro, meu, desejado, valAlvo);
  if(!oferta) return;
  S.propostas.push({
    id:'PROP'+(S.propId=(S.propId||0)+1),
    outroId:outro.id, outroAb:outro.ab, outroNome:outro.cidade+' '+outro.nick,
    querem:[desejado.id],           // jogador meu que eles querem
    oferecem:oferta.jogadores.map(p=>p.id),  // jogadores deles
    oferecemPicks:(oferta.picks||[]).map(pk=>pk.id),
    rodadaExpira:S.rodada+RI(4,9)
  });
  noticia('📨 '+outro.cidade+' '+outro.nick+' quer negociar por '+desejado.nome.split(' ').pop()+' — veja o Mercado.','p');
}
function necessidadesTime(t){
  const porPos={PG:[],SG:[],SF:[],PF:[],C:[]};
  t.elenco.forEach(p=>porPos[p.pos].push(p.ovr));
  const nec={};
  for(const pos in porPos){
    const arr=porPos[pos].sort((a,b)=>b-a);
    const melhor=arr[0]||40, prof=arr.length;
    nec[pos]=clamp((80-melhor)*1.6 + (prof<2?18:prof<3?6:0), 0, 100);
  }
  return nec;
}
// o outro time (comprador) monta o que oferece por um jogador meu
function montarOfertaIA(comprador, meu, alvo, valAlvo){
  const alvoValor=valAlvo*1.02; // a IA oferece perto do valor justo (levemente a favor dela)
  const cand=comprador.elenco.filter(p=>p.ovr<alvo.ovr+2) // não oferece estrelas maiores
    .map(p=>({p,val:valorMercado(p)})).sort((a,b)=>b.val-a.val);
  // tenta combos de 1-3 jogadores
  for(let n=1;n<=3;n++){
    const combo=comboAtinge(cand,n,alvoValor);
    if(combo){
      const nMeu=meu.elenco.length-1+combo.length;
      const nOutro=comprador.elenco.length-combo.length+1;
      if(nMeu>=9&&nMeu<=15&&nOutro>=9&&nOutro<=15)
        return {jogadores:combo.map(c=>c.p), picks:[]};
    }
  }
  // se não fecha com jogadores, adiciona um pick de 1ª rodada
  const combo1=comboAtinge(cand,1,alvoValor*0.6);
  const picks=picksDe(comprador.id).filter(pk=>pk.rodada===1).sort((a,b)=>valorPick(b)-valorPick(a));
  if(combo1&&picks.length){
    const soma=combo1.reduce((s,c)=>s+c.val,0)+valorPick(picks[0]);
    if(soma>=alvoValor){
      const nMeu=meu.elenco.length-1+combo1.length;
      const nOutro=comprador.elenco.length-combo1.length+1;
      if(nMeu>=9&&nMeu<=15&&nOutro>=9&&nOutro<=15)
        return {jogadores:combo1.map(c=>c.p), picks:[picks[0]]};
    }
  }
  return null;
}
function comboAtinge(cand,n,alvo){
  const o=[...cand].sort((a,b)=>b.val-a.val);
  for(let i=0;i<o.length;i++){
    if(n===1){if(o[i].val>=alvo)return [o[i]];}
    else if(n===2){for(let j=i+1;j<o.length;j++)if(o[i].val+o[j].val>=alvo)return [o[i],o[j]];}
    else{for(let j=i+1;j<o.length;j++)for(let k=j+1;k<o.length;k++)if(o[i].val+o[j].val+o[k].val>=alvo)return [o[i],o[j],o[k]];}
  }
  return null;
}
function expirarPropostas(){
  if(!S.propostas)return;
  S.propostas=S.propostas.filter(pr=>pr.rodadaExpira>S.rodada);
}
function aceitarProposta(propId){
  const pr=(S.propostas||[]).find(p=>p.id===propId);
  if(!pr)return;
  const meu=S.times[S.meuTime], outro=S.times[pr.outroId];
  const meus=meu.elenco.filter(p=>pr.querem.includes(p.id));
  const deles=outro.elenco.filter(p=>pr.oferecem.includes(p.id));
  const delesPicks=(S.picks||[]).filter(pk=>pr.oferecemPicks.includes(pk.id)&&pk.via===outro.id);
  if(!meus.length||meus.length!==pr.querem.length){alert('Proposta expirada.');S.propostas=S.propostas.filter(p=>p.id!==propId);render();return;}
  executarTroca(meus,deles,pr.outroId,[],delesPicks);
  S.propostas=S.propostas.filter(p=>p.id!==propId);
  render();
}
function recusarProposta(propId){
  S.propostas=(S.propostas||[]).filter(p=>p.id!==propId);

}
/* ============================================================
   NEGOCIAÇÃO DE CONTRATOS (regras estilo NBA)
   ============================================================ */
// salário máximo permitido conforme anos de liga (tempo de carreira)
function salarioMaximo(p){
  // estima anos de liga pela idade (entrou ~19-22 anos)
  const anosLiga = Math.max(0, p.idade - 19);
  let pct;
  if(anosLiga>=10) pct=0.35;       // veteranos: 35% do teto
  else if(anosLiga>=7) pct=0.30;   // 30%
  else pct=0.25;                    // novatos/jovens: 25%
  // jogador de elite alcança o teto da sua faixa; medianos, menos
  const fator = clamp((p.ovr-70)/25, 0.15, 1); // ovr 70 -> 15%, ovr 95 -> 100% da faixa
  const teto = TETO*pct;
  const piso = 1.2e6;
  return Math.round(clamp(piso + (teto-piso)*fator, piso, teto)/1e5)*1e5;
}
// salário "justo" que o jogador espera (base para negociação)
function salarioDesejado(p){
  const base=valorSalarial(p);
  // craques querem perto do máximo; a moral influencia (feliz aceita um pouco menos)
  const max=salarioMaximo(p);
  const alvo = p.ovr>=88? max*0.98 : p.ovr>=82? Math.min(max, base*1.15) : base*1.05;
  const ajusteMoral = p.moral>=75? 0.96 : p.moral<45? 1.10 : 1.0; // feliz cobra menos
  return Math.round(clamp(alvo*ajusteMoral, 1.2e6, max)/1e5)*1e5;
}
// aumento anual permitido: 8% se renovar com o PRÓPRIO time (Bird), senão 5%
function aumentoAnualMax(mesmoTime){ return mesmoTime? 0.08 : 0.05; }

// avalia uma proposta de contrato do usuário a um jogador
// retorna {ok, msg, contraproposta?}
function avaliarProposta(p, salarioAno1, anos, mesmoTime){
  const max=salarioMaximo(p);
  const desejado=salarioDesejado(p);
  if(salarioAno1>max) return {ok:false, msg:'Acima do salário máximo permitido ('+$(max)+' para '+(p.idade-19)+' anos de liga).'};
  if(anos<1||anos>5) return {ok:false, msg:'Contratos vão de 1 a 5 anos.'};
  // o jogador compara com o que deseja
  const razao = salarioAno1/desejado;
  // craques exigem mais; role players são flexíveis
  const exigencia = p.ovr>=85? 0.95 : p.ovr>=78? 0.88 : 0.80;
  if(razao>=exigencia){
    // aceita — quanto maior a oferta e mais anos, mais feliz
    return {ok:true, msg:'Proposta aceita! '+p.nome+' topou '+anos+' ano(s) por '+$(salarioAno1)+'/ano.'};
  }
  // contrapropõe o que deseja (respeitando o máximo)
  const pedido=Math.min(max, Math.round(desejado/1e5)*1e5);
  return {ok:false, msg:p.nome+' recusou. Ele quer cerca de '+$(pedido)+'/ano.', contraproposta:pedido};
}
// aplica um contrato aceito
function assinarContrato(p, salarioAno1, anos, mesmoTime){
  p.salario=salarioAno1;
  p.anos=anos;
  p.contratoAumento = aumentoAnualMax(mesmoTime); // guardado para referência
  p.moral=clamp(p.moral+ (mesmoTime?10:6), 0, 100);
}
/* ============================================================
   PRÊMIOS INDIVIDUAIS, TIME IDEAL E CAMISAS APOSENTADAS
   ============================================================ */
// média por jogo de uma estatística
function porJogo(p,k){ return p.stats.j>0? p.stats[k]/p.stats.j : 0; }
// "valor" de um jogador na temporada (base para MVP e Time Ideal)
function scoreTemporada(p, timeVitorias){
  const j=p.stats.j; if(j<20) return -1; // precisa ter jogado o suficiente
  const pts=porJogo(p,'pts'), reb=porJogo(p,'reb'), ast=porJogo(p,'ast');
  const stl=porJogo(p,'stl'), blk=porJogo(p,'blk'), to=porJogo(p,'to');
  const efic=(pts+reb*1.1+ast*1.4+stl*2.2+blk*2.2-to*1.2);
  // sucesso do time importa para o MVP
  return efic + (timeVitorias||0)*0.25;
}
function scoreDefensivo(p){
  const j=p.stats.j; if(j<20) return -1;
  const reb=porJogo(p,'reb'), stl=porJogo(p,'stl'), blk=porJogo(p,'blk');
  // atributos defensivos contam junto com produção
  const at=(p.at.defI+p.at.defP+p.at.reb)/3;
  return blk*4.5 + stl*4 + reb*1.4 + at*0.4;
}
// apura todos os prêmios ao fim da temporada regular
function apurarPremios(){
  const jogadores=[];
  S.times.forEach(t=>t.elenco.forEach(p=>jogadores.push({p,t})));
  const comVit = x => x.t.v;
  // MVP
  const mvp=[...jogadores].map(x=>({...x,sc:scoreTemporada(x.p,x.t.v)}))
    .filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc)[0];
  // Novato do ano (jogou <=2 anos ou é novato)
  const roy=[...jogadores].filter(x=>x.p.idade<=22 && x.p.stats.j>=30)
    .map(x=>({...x,sc:scoreTemporada(x.p,x.t.v)})).filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc)[0];
  // Melhor defensor
  const dpoy=[...jogadores].map(x=>({...x,sc:scoreDefensivo(x.p)}))
    .filter(x=>x.sc>0).sort((a,b)=>b.sc-a.sc)[0];
  // Cestinha, Rei dos rebotes, Rei das assistências
  const lider=(k)=>[...jogadores].filter(x=>x.p.stats.j>=30)
    .map(x=>({...x,v:porJogo(x.p,k)})).sort((a,b)=>b.v-a.v)[0];
  const cestinha=lider('pts'), rebotes=lider('reb'), assist=lider('ast');
  // TIME IDEAL (All-NBA): melhores por posição, 3 quintetos
  const porPos={PG:[],SG:[],SF:[],PF:[],C:[]};
  jogadores.forEach(x=>{ const sc=scoreTemporada(x.p,x.t.v); if(sc>0)porPos[x.p.pos].push({...x,sc}); });
  for(const k in porPos) porPos[k].sort((a,b)=>b.sc-a.sc);
  const timesIdeais=[[],[],[]];
  ['PG','SG','SF','PF','C'].forEach(pos=>{
    for(let q=0;q<3;q++){ if(porPos[pos][q]) timesIdeais[q].push(porPos[pos][q]); }
  });
  const snap=x=> x? {nome:x.p.nome, ab:x.t.ab, pos:x.p.pos, id:x.p.id,
    linha:`${porJogo(x.p,'pts').toFixed(1)}p · ${porJogo(x.p,'reb').toFixed(1)}r · ${porJogo(x.p,'ast').toFixed(1)}a`} : null;
  const premios={
    temp:S.temporada,
    mvp:snap(mvp), roy:snap(roy), dpoy:snap(dpoy),
    cestinha:snap(cestinha), rebotes:snap(rebotes), assist:snap(assist),
    timeIdeal: timesIdeais.map(q=>q.map(snap))
  };
  if(!S.premiacoes)S.premiacoes=[];
  S.premiacoes.unshift(premios);
  if(S.premiacoes.length>12)S.premiacoes.pop();
  // registra troféus no jogador (para camisas aposentadas depois)
  const marca=(x,tipo)=>{ if(!x)return; const jg=x.p; if(!jg.trofeus)jg.trofeus={}; jg.trofeus[tipo]=(jg.trofeus[tipo]||0)+1; };
  marca(mvp,'mvp'); marca(dpoy,'dpoy'); marca(roy,'roy');
  timesIdeais.forEach((q,i)=>q.forEach(x=>{if(x){if(!x.p.trofeus)x.p.trofeus={};x.p.trofeus.allnba=(x.p.trofeus.allnba||0)+1;}}));
  if(mvp)noticia('🏆 MVP da temporada '+S.temporada+': '+mvp.p.nome+' ('+mvp.t.ab+')','p');
  return premios;
}
// camisas aposentadas: quando uma lenda se aposenta, o último time dela aposenta o número
function aposentarCamisa(p, timeAb){
  if(!S.camisas)S.camisas={};
  if(!S.camisas[timeAb])S.camisas[timeAb]=[];
  const tit=(p.trofeus&&p.trofeus.mvp)?p.trofeus.mvp:0;
  const allnba=(p.trofeus&&p.trofeus.allnba)?p.trofeus.allnba:0;
  // só aposenta se teve carreira notável (MVP, muitos All-NBA, ou campeão de destaque)
  const notavel = tit>=1 || allnba>=3 || (p.carreira && p.carreira.pts>12000) || p.ovrPico>=90;
  if(!notavel) return false;
  S.camisas[timeAb].push({
    nome:p.nome, pos:p.pos, numero:p.numero||RI(0,55),
    temp:S.temporada, ovrPico:p.ovrPico||p.ovr,
    mvp:tit, allnba, campeao:(p.camp||0)
  });
  noticia('🎽 O '+timeAb+' aposentou a camisa de '+p.nome+', uma lenda da franquia!','p');
  return true;
}

function renovar(id){
  const t=S.times[S.meuTime],p=t.elenco.find(x=>x.id===id);
  if(!p)return;
  const novo=Math.round(valorSalarial(p)*(1.05+(p.moral<50?0.22:0))/1e5)*1e5;
  const folhaNova=folha(t)-p.salario+novo;
  // Renovar o PRÓPRIO jogador é permitido mesmo acima do teto (como os Bird Rights na NBA).
  // Só avisamos sobre o imposto de luxo, mas não bloqueamos.
  if(folhaNova>TETO){
    const excede=folhaNova-TETO;
    const imposto=Math.round(excede*1.5); // multa de luxo proporcional ao estouro
    if(!confirm(p.nome+' renovaria por '+$(novo)+'/ano.\n\nIsso deixa sua folha em '+$(folhaNova)+
      ', acima do teto de '+$(TETO)+'. Você pode manter seu craque (Bird Rights), mas pagará um imposto de luxo de '+$(imposto)+' agora.\n\nConfirmar renovação?')) return;
    t.caixa-=imposto;
    noticia('💰 Imposto de luxo de '+$(imposto)+' pago para renovar '+p.nome+'.','x');
  }
  p.salario=novo;p.anos+=3;p.moral=clamp(p.moral+12,0,100);
  noticia('📄 '+p.nome+' renovou por 3 anos ('+$(novo)+'/ano)','v');
  closeModal();render();
}
function cortar(id){
  const p=S.times[S.meuTime].elenco.find(x=>x.id===id);
  if(!confirm('Dispensar '+p.nome+'? Multa de '+$(p.salario*0.35)+'.'))return;
  const e=dispensar(p); if(e)alert(e); closeModal();render();
}

function vCal(){

  const rows=meus.map(({i,j})=>{

      <td>${adv.v}-${adv.d}</td><td>${forcaTime(adv)}</td><td>${j.res?`<span class="pill ${cls}">${r}</span>`:'<span class="muted">a jogar</span>'}</td></tr>`;

  return `<h2 class="sec">Calendário</h2>
  <div class="split"><div class="card tbl-wrap"><table><thead><tr><th>#</th><th>Adversário</th><th>Camp.</th><th>Força</th><th>Resultado</th></tr></thead><tbody>${rows}</tbody></table></div>

  pool=pool.filter(x=>
    (f.pos==='TODAS'||x.p.pos===f.pos) &&
    (f.time==='TODOS'||x.tm.id===+f.time) &&
    x.p.idade<=f.idadeMax &&
    x.p.ovr>=f.ovrMin

  // ordenação
  const ord={ovr:(a,b)=>b.p.ovr-a.p.ovr, idade:(a,b)=>a.p.idade-b.p.idade,
    pot:(a,b)=>b.p.pot-a.p.pot, salario:(a,b)=>a.p.salario-b.p.salario,
    valor:(a,b)=>valorMercado(a.p)-valorMercado(b.p)};

function trocaUI(meu,outro){
  const lista=(time,lado)=>`<div style="max-height:190px;overflow:auto;border:1px solid var(--line);padding:6px">
    ${time.elenco.map(p=>{
      const on=TROCA[lado].includes(p.id);

        <b>${$(p.salario)}</b></div>`;}).join('')}</div>`;
  const listaPicks=(timeId,lado)=>{
    const pk=picksDe(timeId).sort((a,b)=>a.ano-b.ano||a.rodada-b.rodada);
    if(!pk.length)return `<div class="hint" style="padding:4px">sem picks</div>`;
    return `<div style="max-height:120px;overflow:auto;border:1px solid var(--line);padding:6px;margin-top:6px">
      ${pk.map(p=>{const on=TROCA[lado].includes(p.id);
        return `<div class="kv" style="cursor:pointer;font-size:12px;${on?'background:rgba(200,121,46,.15)':''}" onclick="togPick('${lado}','${p.id}')">
          <span>${on?'✔ ':''}${esc(nomePick(p))}</span><b>${M$(valorPick(p))}</b></div>`;}).join('')}</div>`;
  };
  const meus=meu.elenco.filter(p=>TROCA.meus.includes(p.id));
  const deles=outro.elenco.filter(p=>TROCA.deles.includes(p.id));
  const meusPk=picksDe(meu.id).filter(p=>(TROCA.meusPicks||[]).includes(p.id));
  const delesPk=picksDe(outro.id).filter(p=>(TROCA.delesPicks||[]).includes(p.id));
  const av=(meus.length||deles.length||meusPk.length||delesPk.length)?avaliarTroca(meus,deles,outro.id,meusPk,delesPk):null;
  const vEnv=meus.reduce((s,p)=>s+valorMercado(p),0)+meusPk.reduce((s,p)=>s+valorPick(p),0);
  const vRec=deles.reduce((s,p)=>s+valorMercado(p),0)+delesPk.reduce((s,p)=>s+valorPick(p),0);
  return `<div class="grid g2" style="margin-top:10px">
    <div><h3 class="sub">Você oferece</h3>${lista(meu,'meus')}
      <div class="hint" style="margin-top:6px">Picks (clique para incluir)</div>${listaPicks(meu.id,'meusPicks')}</div>
    <div><h3 class="sub">Você recebe</h3>${lista(outro,'deles')}
      <div class="hint" style="margin-top:6px">Picks (clique para incluir)</div>${listaPicks(outro.id,'delesPicks')}</div></div>
    ${av?`<div class="card" style="margin-top:10px;border-left:4px solid ${av.ok?'var(--green)':'var(--red)'}">
      <b>${esc(av.msg)}</b>
      <div class="hint">Valor enviado ${M$(vEnv)} · recebido ${M$(vRec)}</div>
      ${av.ok?`<div class="row" style="margin-top:8px"><button class="btn mini" onclick="fecharTroca(${outro.id})">Confirmar troca</button></div>`:''}
    </div>`:''}`;
}
function tog(lado,id){const a=TROCA[lado];const i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);render();}
function togPick(lado,id){TROCA[lado]=TROCA[lado]||[];const a=TROCA[lado];const i=a.indexOf(id);i<0?a.push(id):a.splice(i,1);render();}
function fecharTroca(oid){
  const meu=S.times[S.meuTime],outro=S.times[oid];
  const meus=meu.elenco.filter(p=>TROCA.meus.includes(p.id));
  const deles=outro.elenco.filter(p=>TROCA.deles.includes(p.id));
  const meusPk=picksDe(meu.id).filter(p=>(TROCA.meusPicks||[]).includes(p.id));
  const delesPk=picksDe(outro.id).filter(p=>(TROCA.delesPicks||[]).includes(p.id));
  const av=avaliarTroca(meus,deles,oid,meusPk,delesPk); if(!av.ok){alert(av.msg);return;}
  executarTroca(meus,deles,oid,meusPk,delesPk);TROCA={meus:[],deles:[],alvo:oid,meusPicks:[],delesPicks:[]};render();
}

/* ---------- FINANÇAS ---------- */
function impostoLuxo(t){
  const excede=Math.max(0, folha(t)-TETO);
  if(excede<=0) return 0;
  // faixas progressivas (inspirado na NBA): quanto mais estoura, maior a alíquota
  let mult=1.5;
  if(excede>25e6) mult=2.5; else if(excede>15e6) mult=2.0;
  return Math.round(excede*mult);
}
function vFin(){
  const t=S.times[S.meuTime];
  const oc=ocupacao(t),pub=Math.round(t.capacidade*oc);
  const jogosCasa=Math.round(JOGOS_TEMP/2);
  // RECEITAS anuais

  const receitaTotal=recBilheteria+recConsumo+recPatroc+recTV;
  // DESPESAS anuais

  const linha=(nome,val,cor)=>`<div class="kv"><span>${nome}</span><b style="${cor?'color:'+cor:''}">${$(val)}</b></div>`;

  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3 class="sub">📈 Receitas (anual)</h3>
      ${linha('Direitos de TV',recTV)}

      ${linha('Consumo na arena',recConsumo)}
      <div class="kv" style="border-top:2px solid var(--wood);margin-top:4px"><span><b>Total</b></span><b>${$(receitaTotal)}</b></div>
    </div>
    <div class="card"><h3 class="sub">📉 Despesas (anual)</h3>
      ${linha('Folha salarial',despFolha, despFolha>TETO?'var(--red)':'')}
      ${linha('Imposto de luxo',despLuxo, despLuxo>0?'var(--red)':'')}
      ${linha('Salário do técnico',despTecnico)}
      ${linha('Operação e viagens',despOper)}
      <div class="kv" style="border-top:2px solid var(--wood);margin-top:4px"><span><b>Total</b></span><b>${$(despesaTotal)}</b></div>
    </div>
  </div>
  <div class="grid g2" style="margin-top:14px">
    <div class="card"><h3 class="sub">🎟 Bilheteria & arena</h3>

      <div class="kv"><span>Receita por jogo em casa</span><b>${$(Math.round((recBilheteria+recConsumo)/jogosCasa))}</b></div>
      <h3 class="sub" style="margin-top:14px">Preço do ingresso — US$ ${t.ingresso}</h3>

function vDraft(){
  const quem=S.ordemDraft[S.draftPick];
  const minhaVez=quem===S.meuTime;
  const donoSlot=S.ordemDonos?S.ordemDonos[S.draftPick]:quem;
  // quantas escolhas o usuário ainda tem neste draft
  const minhasRestantes=S.ordemDraft.slice(S.draftPick).filter(id=>id===S.meuTime).length;
  const slotDe = donoSlot!==quem ? ` (pick originalmente de ${esc(S.times[donoSlot].ab)}, adquirido via troca)` : '';
  return `<div class="card accent"><h3 class="sub">Draft de novatos · escolha ${S.draftPick+1} de 30</h3>
    <div class="hint" style="margin-bottom:8px">Escolhe agora: <b>${esc(S.times[quem].ab)}</b>${slotDe} · você ainda tem <b>${minhasRestantes}</b> escolha(s) neste draft.</div>
    ${minhaVez?`<p><b>É a sua vez de escolher!</b></p>
      <div class="tbl-wrap" style="max-height:340px;overflow:auto;margin-top:8px"><table><thead><tr>
      <th>Prospecto</th><th>Pos</th><th>Id</th><th>Ovr</th><th>Pot</th><th>Arquétipo</th><th></th></tr></thead><tbody>
      ${S.draft.slice(0,16).map(p=>`<tr><td class="name clickable" onclick="fichaJogador(${p.id})">${esc(p.nome)}</td>
        <td>${bd(p.pos)}</td><td>${p.idade}</td><td><span class="ovr">${p.ovr}</span></td>
        <td class="muted">${p.pot}</td><td class="muted" style="font-size:11px">${ARQNM[p.arq]||p.arq||''}</td>
        <td><button class="btn mini" onclick="draftar(${p.id})">Selecionar</button></td></tr>`).join('')}
      </tbody></table></div>`
    :`<p class="hint">${esc(S.times[quem].nick)} está escolhendo...</p>
      <button class="btn" onclick="rodarDraft()">Avançar até minha próxima escolha</button>`}</div>`;
}
function rodarDraft(){
  // avança automaticamente até a vez do usuário ou o fim
  let guard=0;
  while(S.fase==='draft' && S.ordemDraft[S.draftPick]!==S.meuTime && guard++<60){
    executarDraft();
  }
  render();
}
function draftar(id){
  const p=S.draft.find(x=>x.id===id);
  executarDraft(p);
  if(S.fase==='draft')executarDraft();
  render();
}
function encerrarTemporada(){
  const rel=processarOffseason();
  rel.slice(0,6).forEach(r=>noticia('🎓 '+r));
  S.draftPick=0;S.avaliado=false;
  render();
}

  <p class="hint" style="margin-top:8px">${t.elenco.length} jogadores · folha ${$(folha(t))} · força ${forcaTime(t)}</p></div>
